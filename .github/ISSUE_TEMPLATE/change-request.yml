name: "Change Request"
description: "Report a bug, crash, or request an enhancement for an agent skill"
labels: []
body:
  - type: markdown
    attributes:
      value: |
        ### ⚠️ Title (required)
        Enter a one-line summary of your issue in the **Title** field above.

  - type: dropdown
    id: issue_type
    attributes:
      label: Issue Type
      options:
        - Change Request
    validations:
      required: true

  - type: dropdown
    id: skill
    attributes:
      label: Skill
      description: Which skill is affected?
      options:
        - Unknown
        - axi4-debug-sim
        - config-qor-helper
        - congestion-analysis
        - convert-aie-to-test-harness
        - create-dsplib
        - create-dsplib-graph
        - create-dsplib-makefile
        - create-dsplib-readme
        - create-dsplib-stimuli
        - create-kernel
        - create-kernel-aiecst
        - create-kernel-app
        - create-kernel-cfg
        - create-kernel-cpp
        - create-kernel-graph
        - create-kernel-hpp
        - create-kernel-makefile
        - device-floorplan
        - embedded-software-app-skill
        - extract-aie-latency
        - extract-aie-loop-ii
        - extract-aie-resources
        - extract-aie-throughput
        - hls-architect
        - hls-array-to-stream
        - hls-burst-inference
        - hls-component-basic-info
        - hls-cosim-report
        - hls-dataflow
        - hls-dataflow-infos
        - hls-flattenable
        - hls-impl-report
        - hls-line-buffer
        - hls-matlab-to-cpp
        - hls-optimize
        - hls-perf-pragma
        - hls-pragma-scope
        - hls-run-flow
        - hls-stencil-pattern
        - hls-synth-report
        - hls-synthesizable
        - hw-ddrmc-debug
        - hw-ibert-gt-debug
        - hw-ila-debug
        - hw-noc-debug
        - hw-noc-perfmon
        - hw-pcie-link-debug
        - hw-sysmon
        - hw-vio-debug
        - matlab-to-aie
        - matlab-to-aie-analyze
        - matlab-to-aie-graph
        - matlab-to-aie-kernel
        - matlab-to-aie-ml
        - matlab-to-aie-ml-v2
        - matlab-to-aie-validate
        - matlab-to-aie-vectorize
        - opt-design-analysis
        - optimize-aie-buffers-to-parameters
        - optimize-aie-diagonal-matrix-extract
        - optimize-aie-diagonal-matrix-init
        - optimize-aie-memory-access
        - optimize-aie-scalar-divide
        - optimize-aie-split-accumulator
        - phys-opt-design-analysis
        - rtl-elaboration-analysis
        - rtl-lint
        - segcfg-build-images
        - segcfg-debug-guide
        - segcfg-design-check
        - segcfg-firmware-build
        - segcfg-overview
        - segcfg-pl-reload
        - segcfg-programming
        - segcfg-project-setup
        - timing-methodology-checks
        - versal-rtl-coding-guidelines
        - versal-rtl-design-advisories
        - versal-timing-closure
        - vhls-opt
        - vitis_application_creation_skill
        - vitis-functional-sim
        - vitis-hw-emu-solution
        - vivado-bd-ila-insert
        - vivado-bd-vio-insert
        - vivado-opt-design-analyze
        - vivado-post-route-analyze
        - vivado-revision-control
        - vivado-skill-creator
        - vivado-timing-closure
        - workload-partition-advisor
        - xsct-to-python-converter
    validations:
      required: true

  - type: input
    id: skill_version
    attributes:
      label: Skill Version
      description: Version of the skill (MMYY format)
      placeholder: "e.g. 0526"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe what you observed and what you expected
      placeholder: "Describe what you observed, what you expected..."
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      description: Numbered steps to reproduce the issue
      placeholder: |
        1. Open Vivado project...
        2. Ask the agent to...
        3. ...
    validations:
      required: true

  - type: textarea
    id: llm_prompt
    attributes:
      label: LLM Prompt Used
      description: The exact prompt that produced the issue
      placeholder: "e.g. @rtl-lint Run lint on my design..."
    validations:
      required: true

  - type: input
    id: llm_model
    attributes:
      label: LLM Model
      description: Which LLM model was used
      placeholder: "e.g. Claude Sonnet 4, GPT-4.1"
    validations:
      required: true

  - type: dropdown
    id: problem_type
    attributes:
      label: Problem Type
      description: Category of the problem
      options:
        - Behavior Incorrect
        - Information Incorrect
        - Information Missing/Unclear
        - Logic Incorrect
        - Crash
        - Fatal/Internal Error
        - Ease of Use - Enhancement
        - Specification Change
        - Runtime - Defect
        - Debug/Test Assistance
        - Tracking
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: Source
      description: How this issue was discovered
      options:
        - Internal
        - Internal - Verification
        - Internal - Verification Testbench
        - Internal - Code Review
        - Internal - Code Coverage Report
        - Cust-Critical
        - Cust-NotCritical
        - Cust-Has Workaround
        - intCust-Critical
        - intCust-Has Workaround
        - intCust - TRD Critical
        - AE Testing Bash
        - FAE
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Issue priority (set during triage)
      options:
        - "0"
        - "1"
        - "2"
        - "3"
    validations:
      required: false

  - type: dropdown
    id: customer_impact
    attributes:
      label: Customer Impact
      description: Level of customer impact
      options:
        - "0"
        - "1"
        - "2"
        - "3"
    validations:
      required: false

  - type: input
    id: salesforce_id
    attributes:
      label: Salesforce Case ID
      description: WTS integration — link to customer case
      placeholder: "e.g. 5001234567"
    validations:
      required: false

  - type: input
    id: os_found
    attributes:
      label: OS Found
      description: Operating system where the issue was observed
      placeholder: "e.g. RHEL 8.8, Ubuntu 22.04, Win 11"
    validations:
      required: true

  - type: input
    id: ide
    attributes:
      label: IDE/CLI
      description: IDE or CLI tool used
      placeholder: "e.g. VSCode, Cursor, Windsurf, Vivado Tcl"
    validations:
      required: true

  - type: input
    id: ide_version
    attributes:
      label: IDE/CLI Version
      description: Version of the IDE or CLI
      placeholder: "e.g. 1.89.0"
    validations:
      required: true

  - type: input
    id: vivado_mcp_version
    attributes:
      label: Vivado MCP Version
      description: Version of the Vivado MCP Server (MMYY format)
      placeholder: "e.g. 0526"
    validations:
      required: false

  - type: input
    id: vivado_version
    attributes:
      label: Vivado Version
      description: Vivado tool version used
      placeholder: "e.g. 2025.1, 2024.2"
    validations:
      required: false

  - type: input
    id: other_mcp
    attributes:
      label: Other MCP Used
      description: If additional MCP servers were active during the issue
      placeholder: "e.g. custom-mcp-server v1.2"
    validations:
      required: false

  - type: input
    id: testcase_history_link
    attributes:
      label: Testcase History Link
      description: Link to testcase history
      placeholder: "e.g. https://..."
    validations:
      required: false

  - type: textarea
    id: attachments
    attributes:
      label: Attachments
      description: Drag and drop files, screenshots, logs, or paste relevant output
      placeholder: "Drag and drop files, screenshots, logs..."
    validations:
      required: false
