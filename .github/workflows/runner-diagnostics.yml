      #     {
      #       echo "### Vivado MCP server"
      #       echo
      #       echo "| Found | Path |"
      #       echo "|---|---|"
      #       echo "| yes | \`$PWD/$BIN\` |"
      #       echo
      #     } >> "$GITHUB_STEP_SUMMARY"

      # Lemonade/local-LLM deployment (docs/staging/local-kb/local-llm.md)
      # needs a dedicated AMD ROCm GPU host with pre-staged GGUF model
      # files -- not something a workflow step can bootstrap on the fly.
      # This checks whether xsjhalo06 already has any of that (a GPU, a
      # lemonade/llama-server binary or running process, or staged model
      # files at the doc's expected locations) rather than assuming either
      # way.
      - name: Search for existing Lemonade / local-LLM setup
        continue-on-error: true
        run: |
          echo "== GPU hardware =="
          if command -v rocm-smi >/dev/null 2>&1; then
            echo "rocm-smi found:"
            rocm-smi --showproductname 2>&1 || true
          else
            echo "rocm-smi not found on PATH"
          fi
          if command -v nvidia-smi >/dev/null 2>&1; then
            echo "nvidia-smi found:"
            nvidia-smi -L 2>&1 || true
          else
            echo "nvidia-smi not found on PATH"
          fi
          if [ -d /dev/dri ]; then
            echo "/dev/dri contents:"
            ls -la /dev/dri
          else
            echo "/dev/dri not present"
          fi

          echo
          echo "== lemonade / llama-server binaries and processes =="
          for bin in lemonade lemonade-server llama-server; do
            if command -v "$bin" >/dev/null 2>&1; then
              echo "$bin found: $(command -v "$bin")"
            else
              echo "$bin not found on PATH"
            fi
          done
          echo "-- matching processes --"
          pgrep -fa "lemonade|llama-server" 2>/dev/null || echo "none running"

          echo
          echo "== staged model locations (per local-llm.md) =="
          for d in /opt/local-llm/runtime /var/lib/local-llm/models "$HOME/.cache/lemonade" "$HOME/.local/share/lemonade"; do
            if [ -e "$d" ]; then
              echo "-- $d --"
              ls -la "$d" 2>&1 | head -20
            else
              echo "-- $d: not present --"
            fi
          done

          echo
          echo "== ports 8000 / 8001 / 13305 (lemonade/llama-server defaults) =="
          for port in 8000 8001 13305; do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 3 "http://127.0.0.1:$port/v1/models" 2>/dev/null) || CODE="unreachable"
            echo "127.0.0.1:$port/v1/models -> $CODE"
          done

      - name: Endpoint reachability
        continue-on-error: true
        run: |
          {
            echo "### Endpoint reachability"
            echo
            echo "| Endpoint | Status |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "== lemonade / OpenAI-compatible endpoints =="
          for url in "http://localhost:8000/api/v1" "http://localhost:11434/v1"; do
            echo "-- $url --"
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 5 "$url") || CODE="unreachable"
            echo "HTTP $CODE"
            echo "| $url | $CODE |" >> "$GITHUB_STEP_SUMMARY"
          done

          echo
          echo "== doc-search MCP =="
          DOC_URL="https://vivado.amd.com/mcp/doc-search"
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 5 "$DOC_URL") || CODE="unreachable"
          echo "HTTP $CODE"
          echo "| $DOC_URL | $CODE |" >> "$GITHUB_STEP_SUMMARY"

          echo
          echo "== Vivado license servers (XILINXD_LICENSE_FILE) =="
          IFS=':' read -ra SERVERS <<< "$XILINXD_LICENSE_FILE"
          for s in "${SERVERS[@]}"; do
            port="${s%@*}"
            host="${s#*@}"
            echo -n "$host:$port -> "
            if timeout 5 bash -c "cat < /dev/null > /dev/tcp/$host/$port" 2>/dev/null; then
              echo "reachable"
              echo "| $host:$port (license) | reachable |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "unreachable"
              echo "| $host:$port (license) | unreachable |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo >> "$GITHUB_STEP_SUMMARY"

      # Raw `skills-test doctor` text report still prints in full to this
      # step's log, exactly as before -- the table below is additive, not a
      # replacement. Doctor's check count (~15-20) is small and bounded, so
      # unlike install/list above this renders every check as its own row
      # rather than condensing.
      - name: Run skills-test doctor (aggregated environment report)
        working-directory: skill_eval
        continue-on-error: true
        run: |
          skills-test doctor
          skills-test doctor --json > /tmp/doctor.json || true
          python3 - <<'PY'
          import json, os

          try:
              with open("/tmp/doctor.json") as f:
                  checks = json.load(f)
          except Exception as exc:
              checks = []
              parse_error = str(exc)
          else:
              parse_error = None

          lines = ["### Doctor checks", ""]
          if parse_error:
              lines.append(f"error: could not parse doctor report: {parse_error}")
          else:
              lines += ["| Check | Status | Detail |", "|---|---|---|"]
              for c in checks:
                  icon = ":white_check_mark:" if c["status"] == "PASS" else ":x:"
                  detail = c["detail"].replace("|", "\\|")
                  lines.append(f"| {c['name']} | {icon} {c['status']} | {detail} |")
              n_fail = sum(1 for c in checks if c["status"] == "FAIL")
              lines += ["", f"**{len(checks) - n_fail}/{len(checks)} passed**"]
          lines.append("")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(lines) + "\n")
          PY
