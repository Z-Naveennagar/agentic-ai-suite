name: "[ZB] Runner Diagnostics"

on:
  workflow_dispatch:
  # workflow_dispatch alone can't be triggered here yet -- GitHub only allows
  # dispatching a workflow that has existed on the default branch at least
  # once, and this file hasn't been merged there. push, unlike
  # workflow_dispatch, has no such restriction: it fires based on whatever
  # the workflow file looks like on the pushed branch itself. Scoped to this
  # feature branch only so it doesn't fire on every push once merged.
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  runner-diagnostics:
    # Focus switch: set the repo variable ZB_ONLY_WORKFLOW to one workflow's
    # slug (runner-diagnostics | opencode-setup | ip-configurator |
    # claude-smoke-test) to make every *other* [ZB] workflow skip its job,
    # so a shared-runner debugging session isn't competing with the rest.
    # Unset (the normal state) means every workflow runs as before. The job
    # is skipped rather than failed, so a suppressed run still reports green.
    # push already fires all four on this branch, so this is the only way to
    # narrow that down short of editing each file.
    if: ${{ vars.ZB_ONLY_WORKFLOW == '' || vars.ZB_ONLY_WORKFLOW == 'runner-diagnostics' }}
    runs-on: [agentic-ai-suite-runner]
    timeout-minutes: 30
    env:
      VIVADO_PATH: /mnt/opt/xilinx/Vivado/bin/vivado
      # Vitis is installed as a sibling of Vivado under the same
      # /mnt/opt/xilinx tree, but -- like Vivado -- never on PATH by
      # default. Same hardcoded-path + "Add ... to PATH" pattern as
      # VIVADO_PATH below, so v++ resolves via PATH for every later step:
      # doctor's existing `_have("v++")` check (shutil.which) picks it up
      # automatically, with no harness code changes, and so does any skill
      # that shells out to v++ directly.
      VITIS_PATH: /mnt/opt/xilinx/Vitis/bin/v++
      PYTHONPATH: ${{ github.workspace }}/skill_eval/src
      # Vivado license servers for this runner (this host's own env already
      # carries these -- confirmed reachable on port 2100).
      XILINXD_LICENSE_FILE: "2100@license-server-flexlm-1.vivado.svc.cluster.local:2100@license-server-flexlm-2.vivado.svc.cluster.local:2100@license-server-flexlm-3.vivado.svc.cluster.local"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Every step below keeps printing its full raw output to its own log
      # exactly as before -- nothing here replaces that. Each step also
      # appends a short markdown table to $GITHUB_STEP_SUMMARY (rendered on
      # the run's Summary tab) built from the same data, so a PASS/FAIL/
      # count overview is visible without opening any step's log. This first
      # step just writes the report title.
      - name: Job summary header
        run: echo "# [ZB] Runner Diagnostics" >> "$GITHUB_STEP_SUMMARY"

      - name: Host identity
        run: |
          HOSTNAME_V=$(hostname)
          WHOAMI_V=$(whoami)
          UNAME_V=$(uname -a)
          NPROC_V=$(nproc)
          MEM_TOTAL=$(free -h | awk '/^Mem:/{print $2}')
          MEM_AVAIL=$(free -h | awk '/^Mem:/{print $7}')
          DISK_ROOT=$(df -h / | awk 'NR==2{print $2" total, "$4" avail, "$5" used"}')

          echo "== host =="
          echo "$HOSTNAME_V"
          echo "$WHOAMI_V"
          echo "$UNAME_V"
          echo
          echo "== cpu / memory =="
          echo "$NPROC_V"
          free -h
          echo
          echo "== disk =="
          df -h

          {
            echo "### Host identity & resources"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Hostname | \`$HOSTNAME_V\` |"
            echo "| User | \`$WHOAMI_V\` |"
            echo "| Kernel | \`$UNAME_V\` |"
            echo "| CPUs | $NPROC_V |"
            echo "| Memory (total / available) | $MEM_TOTAL / $MEM_AVAIL |"
            echo "| Disk (/) | $DISK_ROOT |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Add Vivado to PATH
        run: echo "$(dirname "$VIVADO_PATH")" >> "$GITHUB_PATH"

      - name: Add Vitis to PATH
        run: |
          if [ -x "$VITIS_PATH" ]; then
            echo "$(dirname "$VITIS_PATH")" >> "$GITHUB_PATH"
            echo "added to PATH: $(dirname "$VITIS_PATH")"
          else
            echo "VITIS_PATH not executable, not adding to PATH: $VITIS_PATH"
          fi

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      # Base package only (no [dev]) -- this job doesn't run the pytest suite.
      - name: Install skill_eval harness package
        working-directory: skill_eval
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # Populates skill_testing.test_cases_root (_workspace/, gitignored,
      # empty on every fresh checkout) from tests/<skill>/<suite>/ + the
      # matching staging/<skill>/ skill content -- see skill_eval/CLAUDE.md's
      # "Skill source of truth" section. Without this, `doctor`'s test_cases
      # check and `list` below both report 0 cases, not because discovery is
      # broken but because there's nothing installed yet to discover.
      #
      # A staging/ skill with no matching suite (most of staging/ today --
      # a known, documented gap, see CLAUDE.md) is reported as SKIP and
      # doesn't fail the run; only a real validation problem (bad YAML, an
      # unresolved dependency) does. continue-on-error stays as a safety
      # net for that latter case, so `list` below still runs and shows
      # exactly what did make it in even if some suite is genuinely broken.
      #
      # The real install runs unflagged first, exactly as before (raw log +
      # actual side effect). A second, read-only `--dry-run --json` pass
      # feeds the summary table below -- it doesn't redo or undo the install
      # above, it just re-describes the same tree in a machine-readable
      # shape. staging/ currently has ~80+ skills with no test suite yet
      # (all reported SKIP), so the table only lists summary counts plus any
      # FAILED skills, not a full per-skill dump -- see skills-test list
      # below for the same condensed-vs-full tradeoff.
      - name: Install skill test suites
        working-directory: skill_eval
        continue-on-error: true
        run: |
          skills-test install
          skills-test install --dry-run --json > /tmp/install.json || true
          python3 - <<'PY'
          import json, os

          try:
              with open("/tmp/install.json") as f:
                  data = json.load(f)
          except Exception as exc:
              data = {"error": f"could not parse install report: {exc}"}

          lines = ["### Skill install report", ""]
          if "error" in data:
              lines.append(f"error: {data['error']}")
          else:
              s = data.get("summary", {})
              lines += [
                  "| Passed | Failed | Skipped (no suite) | Dependencies | Total |",
                  "|---|---|---|---|---|",
                  f"| {s.get('passed', 0)} | {s.get('failed', 0)} | "
                  f"{s.get('skipped_no_suite', 0)} | {s.get('dependencies', 0)} | "
                  f"{s.get('total', 0)} |",
              ]
              failed = [sk for sk in data.get("skills", []) if sk["status"] == "FAIL"]
              if failed:
                  lines += ["", "**Failed skills:**", ""]
                  lines += [f"- `{sk['skill']}`: {sk['detail']}" for sk in failed]
          lines.append("")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(lines) + "\n")
          PY

      # Raw `skills-test list` (full per-case table) still prints to this
      # step's log exactly as before. The summary table is condensed to
      # per-skill case counts, not one row per case -- there are 80+ cases
      # today and a full table there would swamp the at-a-glance view this
      # is meant to provide; the full breakdown (tags, vivado/vitis,
      # duration) stays one click away in this step's own log.
      - name: List all discovered test cases
        working-directory: skill_eval
        run: |
          skills-test list
          skills-test list --json > /tmp/cases.json
          python3 - <<'PY'
          import json, os, collections

          with open("/tmp/cases.json") as f:
              cases = json.load(f)
          by_skill = collections.Counter(c["skill"] for c in cases)

          lines = [
              "### Discovered test cases", "",
              f"Total: **{len(cases)}** case(s) across **{len(by_skill)}** skill(s)", "",
              "| Skill | Cases |", "|---|---|",
          ]
          lines += [f"| {skill} | {n} |" for skill, n in sorted(by_skill.items())]
          lines.append("")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(lines) + "\n")
          PY

      # _runtime/ (holds results.db) is otherwise created lazily by the
      # first `skills-test run`, which this diagnostic-only workflow never
      # does -- so doctor's database_parent check would FAIL here even
      # though nothing is actually wrong. Same fix the wip/asbuilt-readback-
      # grading-install-fix branch's copilot-setup-steps.yml already applies.
      - name: Ensure runtime directory exists
        working-directory: skill_eval
        run: mkdir -p _runtime

      - name: Vivado version
        continue-on-error: true
        run: |
          if test -x "$VIVADO_PATH"; then
            VIVADO_EXEC="yes"
            echo "VIVADO_PATH executable: $VIVADO_PATH"
          else
            VIVADO_EXEC="no"
            echo "VIVADO_PATH not executable: $VIVADO_PATH"
          fi
          VIVADO_VER=$("$VIVADO_PATH" -version 2>&1 | head -n1) || VIVADO_VER="vivado -version failed"
          echo "$VIVADO_VER"

          {
            echo "### Vivado"
            echo
            echo "| Executable | Version |"
            echo "|---|---|"
            echo "| $VIVADO_EXEC (\`$VIVADO_PATH\`) | $VIVADO_VER |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Vitis version
        continue-on-error: true
        run: |
          if command -v v++ >/dev/null 2>&1; then
            VITIS_FOUND="yes"
            VITIS_BIN=$(command -v v++)
            # v++ --version's banner starts with a blank line or two, so
            # grab the first non-blank line rather than a bare head -n1.
            VITIS_VER=$(v++ --version 2>&1 | awk 'NF{print; exit}')
          else
            VITIS_FOUND="no"
            VITIS_BIN="-"
            VITIS_VER="v++ not found on PATH"
          fi
          echo "$VITIS_VER"

          {
            echo "### Vitis"
            echo
            echo "| Found | Path | Version |"
            echo "|---|---|---|"
            echo "| $VITIS_FOUND | \`$VITIS_BIN\` | $VITIS_VER |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      # Now redundant for this host in the common case -- "Add Vitis to
      # PATH" above already puts v++ on PATH from VITIS_PATH, so the Vitis
      # version step just above already finds it directly. Kept as a
      # fallback/confirmation: if VITIS_PATH ever goes stale (a version
      # bump moves the installs/ tree) this still finds Vitis via the
      # sibling-of-Vivado relationship and, failing that, a bounded `find`
      # across the well-known EDA install roots (depth + timeout capped, so
      # a cold NFS-backed /proj mount can't hang the job) -- skipped
      # entirely once the sibling check already succeeds.
      - name: Search for any Vitis installation on this host
        continue-on-error: true
        run: |
          echo "== sibling-path check (Vivado -> Vitis under the same installs/ tree) =="
          SIBLING_VPP="${VIVADO_PATH/Vivado/Vitis}"
          SIBLING_VPP="${SIBLING_VPP/%vivado/v++}"
          SIBLING_FOUND="no"
          if [ -x "$SIBLING_VPP" ]; then
            SIBLING_FOUND="yes"
            echo "found: $SIBLING_VPP"
            SIBLING_VER=$("$SIBLING_VPP" --version 2>&1 | awk 'NF{print; exit}')
            [ -n "$SIBLING_VER" ] && echo "$SIBLING_VER"
          else
            echo "not present: $SIBLING_VPP"
          fi

          FOUND_BINS=""
          FOUND_DIRS=""
          ROOTS="/proj/xbuilds /tools /opt /mnt/opt /usr/local"
          if [ "$SIBLING_FOUND" = "yes" ]; then
            echo
            echo "Vitis already confirmed via sibling-path check -- skipping the broader filesystem search."
          else
            echo
            echo "== searching well-known EDA install roots for Vitis =="
            for root in $ROOTS; do
              [ -d "$root" ] || { echo "-- $root: not present --"; continue; }
              echo "-- $root --"
              bins=$(timeout 90 find "$root" -maxdepth 8 -type f -name 'v++' 2>/dev/null)
              dirs=$(timeout 90 find "$root" -maxdepth 7 -type d -iname 'Vitis*' 2>/dev/null)
              [ -n "$bins" ] && echo "$bins"
              [ -n "$dirs" ] && echo "$dirs"
              FOUND_BINS="$FOUND_BINS
          $bins"
              FOUND_DIRS="$FOUND_DIRS
          $dirs"
            done
            FOUND_BINS=$(echo "$FOUND_BINS" | sed '/^$/d')
            FOUND_DIRS=$(echo "$FOUND_DIRS" | sed '/^$/d')
          fi

          if [ "$SIBLING_FOUND" = "no" ] && [ -z "$FOUND_BINS" ] && [ -z "$FOUND_DIRS" ]; then
            echo "no v++ binary or Vitis install directory found anywhere searched"
          fi

          {
            echo "### Vitis installation search"
            echo
            echo "| Check | Result | Version |"
            echo "|---|---|---|"
            echo "| Sibling of Vivado (\`$SIBLING_VPP\`) | $SIBLING_FOUND | ${SIBLING_VER:--} |"
            echo
            if [ -n "$FOUND_BINS" ]; then
              echo "**v++ binaries found under $ROOTS:**"
              echo
              echo "$FOUND_BINS" | while read -r b; do echo "- \`$b\`"; done
              echo
            fi
            if [ -n "$FOUND_DIRS" ]; then
              echo "**Vitis install directories found under $ROOTS:**"
              echo
              echo "$FOUND_DIRS" | while read -r d; do echo "- \`$d\`"; done
              echo
            fi
            if [ "$SIBLING_FOUND" = "no" ] && [ -z "$FOUND_BINS" ] && [ -z "$FOUND_DIRS" ]; then
              echo "No v++ binary or Vitis install directory found under: $ROOTS"
              echo
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Coding-agent CLI versions (as already installed on the runner)
        continue-on-error: true
        run: |
          {
            echo "### Coding-agent CLIs"
            echo
            echo "| CLI | Found | Path | Version |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for bin in claude opencode copilot agent; do
            echo "== $bin =="
            if command -v "$bin" >/dev/null 2>&1; then
              BIN_PATH=$(which "$bin")
              echo "$BIN_PATH"
              BIN_VER=$("$bin" --version 2>&1 | head -n1) || BIN_VER="($bin --version failed)"
              echo "$BIN_VER"
              echo "| $bin | yes | \`$BIN_PATH\` | $BIN_VER |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "not found on PATH"
              echo "| $bin | no | - | - |" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo
          done
          echo >> "$GITHUB_STEP_SUMMARY"

      - name: Configured models and endpoints (from config.yaml)
        working-directory: skill_eval
        run: |
          echo "== cli_backends (models + endpoints declared in config.yaml) =="
          python3 - <<'PY'
          import json
          import os
          import yaml

          cfg = yaml.safe_load(open("config.yaml"))
          backends = cfg.get("cli_backends", {}) or {}
          vivado_mcp = cfg.get("vivado_mcp", {}) or {}

          print(json.dumps(backends, indent=2))
          print()
          print("vivado_mcp:", json.dumps(vivado_mcp, indent=2))

          lines = ["### Configured backends (config.yaml)", ""]
          lines += ["| Backend | Models | Endpoint / bin_path |", "|---|---|---|"]
          for name, cfg_entry in sorted(backends.items()):
              models = ", ".join(cfg_entry.get("default_models", []) or []) or "-"
              endpoint = (
                  cfg_entry.get("lemonade_base_url")
                  or cfg_entry.get("bin_path")
                  or "-"
              )
              lines.append(f"| {name} | {models} | {endpoint} |")
          lines.append("")
          lines.append(f"vivado_mcp bin_path: `{vivado_mcp.get('bin_path', '-')}`")
          lines.append("")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(lines) + "\n")
          PY

      # DISABLED on this runner (2026-08-11): these four steps mint a
      # GitHub App installation token to pull the vivado-mcp-server binary
      # from AMD-aecg-cue-ai/vivado-ai-extensions, a private repo in the old
      # AMD org. This repo lives under a personal account with no APP_ID/
      # APP_PRIVATE_KEY and no app installed on that org, so the step would
      # just fail. Nothing later in *this* workflow consumes VIVADO_MCP_BIN
      # -- it's diagnostic-only here (ip-configurator.yml is the one that
      # actually needs a live binary) -- so dropping it doesn't break
      # anything else in this file. Re-enable once a GitHub App + secrets
      # are set up for this repo, or once the binary is sourced differently.
      #
      # - name: Generate GitHub App token (cross-repo access)
      #   id: app-token
      #   uses: actions/create-github-app-token@v3
      #   with:
      #     app-id: ${{ vars.APP_ID }}
      #     private-key: ${{ secrets.APP_PRIVATE_KEY }}
      #     owner: AMD-aecg-cue-ai
      #     repositories: vivado-ai-extensions
