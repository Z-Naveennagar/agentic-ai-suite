# ==============================================================================
# amd-skills-test — model & hardware pricing
#
# Split out of config.yaml because this data (vendor $/Mtok rates, capex/
# power for self-hosted machines) is maintained on a different cadence and by
# a different concern than harness behavior config: it's a spreadsheet of
# externally-sourced numbers, not a settings file. Validated against
# schemas/pricing_schema.json (same guarantee config.yaml gets against
# config_schema.json). Loaded by core/cost_model.py, which merges this file's
# `model_pricing:` block into the config dict under that same key — nothing
# downstream of cost_model.py (compute_cost, is_self_hosted, describe_machines,
# ...) needed to change for the split.
#
# Lives at the repo root alongside config.yaml (core/paths.py:
# DEFAULT_PRICING_CONFIG). A missing file degrades to "no pricing data"
# (costs come back as None/unknown) rather than a hard error, matching how a
# missing config.yaml behaves.
# ==============================================================================

model_pricing:
  default_currency: usd
  estimation_chars_per_token: 3.5

  # Legacy "cloud-equivalent" flat rate. Used only by self-hosted models that
  # do NOT reference a machine below, or by models where the rule lookup
  # fails. Kept for backward compatibility and for modeling
  # "what would this cost on rented hardware?"
  hosted_gpu_hourly_usd: 1.50
  hosted_gpu_tok_per_sec: 40

  # Hardware cost models for self-hosted boxes. Per-query cost is computed as:
  #   hourly_rate     = capex_usd / (useful_life_years * 8760)        # capex amortized across CALENDAR hours
  #                   + avg_power_watts / 1000 * electricity_usd_per_kwh
  #   query_cost_usd  = elapsed_s / 3600 * hourly_rate
  #
  # Calendar-hour amortization is the right model for hardware you OWN: the
  # box depreciates 24/7 whether or not you are running queries, so the
  # per-query cost should be stable regardless of utilization.  Each query
  # is billed only for the wall-clock seconds it actually consumed.
  #
  # `avg_power_watts` is the FALLBACK estimate used only when a row has no
  # measured power.  When the runner can sample the SoC PPT sensor (Strix
  # Halo / Phoenix iGPU), each self-hosted row is billed at its actual
  # measured average watts (skills_testing/power_meter.py) and the
  # `power_metrics` column on the result row records the active mean,
  # peak, and post-test idle baseline.  The cost_method tag flips from
  # `local_calendar_amortized:<machine>` to `local_measured:<machine>`
  # so the dashboard can disclose the real numbers.
  machines:
    strix_halo:
      description: "AMD Ryzen AI Max+ 395 (Strix Halo) mini-PC / dev kit"
      # Updated 2026-05: average street price for 128 GB consumer mini-PCs
      # (GMKtec EVO-X2 $1999, PELAND YO1 $1850, Nimo $2499, Framework
      # Desktop ~$2500). Excludes Corsair AI WS 300 ($3399) which is a
      # workstation-class outlier.
      capex_usd: 2200
      useful_life_years: 3
      # MEASURED on this Strix Halo box, 2026-05-05, via skills_testing/power_meter.py
      # while Gemma-4-26B-A4B-it-GGUF generated 1100 completion tokens through the
      # Lemonade OpenAI endpoint:
      #   avg_active_w = 89.6 W   peak_w = 98.0 W   idle baseline_w = 17.1 W
      # Rounded to the nearest watt.  Still acts as the FALLBACK when a row has
      # no per-row sampled PPT metric.
      avg_power_watts: 90
      electricity_usd_per_kwh: 0.12  # US commercial average
    # Examples for other accounting choices:
    # cloud_a100_spot:
    #   description: "AWS p4d.24xlarge spot proxy"
    #   override_hourly_usd: 1.50    # rented; bypass capex/electricity
    # workstation_4090:
    #   capex_usd: 3500
    #   useful_life_years: 4
    #   avg_power_watts: 200
    #   electricity_usd_per_kwh: 0.16

