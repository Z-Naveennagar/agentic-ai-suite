    # Sonnet 4.5 has a >200K-context tier ($6.00/$22.50) — not modeled here
    # because every query in this benchmark fits well under 200K input tokens.
    "claude-opus-4.7":                    { input_per_mtok:  5.00, output_per_mtok: 25.00, cache_read_per_mtok: 0.50, cache_write_per_mtok: 6.25 }
    "claude-opus-4.6":                    { input_per_mtok:  5.00, output_per_mtok: 25.00 }
    "claude-opus-4-6":                    { input_per_mtok:  5.00, output_per_mtok: 25.00 }
    "claude-opus-4.5":                    { input_per_mtok:  5.00, output_per_mtok: 25.00 }
