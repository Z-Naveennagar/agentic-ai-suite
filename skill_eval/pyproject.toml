[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amd-skills-test"
version = "0.1.0.dev0"
description = "AMD Agent Skills Testing Infrastructure"
license = {text = "Proprietary"}
requires-python = ">=3.10"
authors = [
    {name = "AMD Vivado AI Team"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
answer-quality = [
    "anthropic>=0.25.0",
    "sentence-transformers>=3.0.0",
    "rouge-score>=0.1.2",
]
pptx = [
    "python-pptx>=0.6.23",
]
dev = [
    "pytest>=8.0",
]
all = [
    "anthropic>=0.25.0",
    "sentence-transformers>=3.0.0",
    "rouge-score>=0.1.2",
    "python-pptx>=0.6.23",
    "pytest>=8.0",
]

[project.scripts]
skills-test = "skills_testing.cli.customer_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
