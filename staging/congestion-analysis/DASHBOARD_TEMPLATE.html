<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Congestion Analysis Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #242836; --border: #2e3347;
    --text: #e1e4ed; --text-dim: #8b90a0; --accent: #6c9eff; --green: #4ade80;
    --red: #f87171; --amber: #fbbf24; --purple: #a78bfa; --cyan: #22d3ee;
    --orange: #fb923c; --pink: #f472b6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         background: var(--bg); color: var(--text); line-height: 1.5; padding: 24px; }
  h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 4px; }
  h2 { font-size: 1.15rem; font-weight: 600; margin-bottom: 12px; color: var(--accent); }
  h3 { font-size: 0.95rem; font-weight: 600; margin-bottom: 8px; color: var(--text); }
  .subtitle { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 20px; }
  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; }
  .header-left { flex: 1; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
  .badge-green { background: rgba(74,222,128,.15); color: var(--green); }
  .badge-red { background: rgba(248,113,113,.15); color: var(--red); }
  .badge-amber { background: rgba(251,191,36,.15); color: var(--amber); }
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; }
  .kpi-label { font-size: 0.72rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: .05em; }
  .kpi-value { font-size: 1.6rem; font-weight: 700; margin-top: 4px; }
  .kpi-sub { font-size: 0.78rem; color: var(--text-dim); margin-top: 2px; }
  .kpi-value.green { color: var(--green); }
  .kpi-value.red { color: var(--red); }
  .kpi-value.amber { color: var(--amber); }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 24px; }
  @media (max-width: 1200px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .card-full { margin-bottom: 24px; }
  .chart-container { position: relative; width: 100%; }
  .chart-container canvas { max-height: 400px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  th { text-align: left; padding: 8px 10px; color: var(--text-dim); font-weight: 600;
       border-bottom: 2px solid var(--border); font-size: 0.72rem; text-transform: uppercase; letter-spacing: .03em; }
  td { padding: 7px 10px; border-bottom: 1px solid var(--border); }
  tr:hover { background: var(--surface2); }
  .num { font-variant-numeric: tabular-nums; text-align: right; }
  .neg { color: var(--red); }
  .pos { color: var(--green); }
  .warn { color: var(--amber); }
  .tab-bar { display: flex; gap: 4px; margin-bottom: 24px; background: var(--surface); border-radius: 10px; padding: 4px; flex-wrap: wrap; }
  .tab { padding: 8px 18px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 500;
         color: var(--text-dim); transition: all .15s; user-select: none; }
  .tab:hover { color: var(--text); background: var(--surface2); }
  .tab.active { background: var(--accent); color: #fff; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .heatmap-grid { display: grid; gap: 3px; margin: 8px 0; }
  .heatmap-cell { padding: 6px 4px; border-radius: 5px; text-align: center; font-size: 0.7rem; font-weight: 600; line-height: 1.2; position: relative; }
  .heat-0 { background: rgba(74,222,128,.12); color: var(--green); }
  .heat-1 { background: rgba(74,222,128,.22); color: var(--green); }
  .heat-2 { background: rgba(251,191,36,.15); color: var(--amber); }
  .heat-3 { background: rgba(251,191,36,.35); color: var(--amber); }
  .heat-4 { background: rgba(248,113,113,.25); color: var(--red); }
  .heat-5 { background: rgba(248,113,113,.45); color: var(--red); }
  .heat-na { background: var(--surface2); color: var(--text-dim); }
  .compass { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; text-align: center; max-width: 280px; margin: 12px auto; }
  .compass-cell { padding: 14px 8px; border-radius: 8px; font-weight: 700; font-size: 1.1rem; }
  .compass-label { font-size: 0.68rem; color: var(--text-dim); text-transform: uppercase; margin-bottom: 2px; }
  .compass-empty { background: transparent; }
  .window-card { background: var(--surface2); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .window-card.short-type { border-left: 4px solid var(--red); }
  .window-card.long-type { border-left: 4px solid var(--orange); }
  .window-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
  .window-title { font-weight: 700; font-size: 0.95rem; }
  .window-badges { display: flex; gap: 6px; align-items: center; }
  .window-badge { padding: 2px 10px; border-radius: 10px; font-size: 0.72rem; font-weight: 700; }
  .type-badge-short { background: rgba(248,113,113,.2); color: var(--red); }
  .type-badge-long { background: rgba(251,146,60,.2); color: var(--orange); }
  .window-coords { font-size: 0.78rem; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }
  .window-crs { font-size: 0.72rem; color: var(--cyan); margin-top: 4px; }
  .resource-bars { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; margin: 10px 0; }
  .resource-bar-item { text-align: center; }
  .resource-bar-label { font-size: 0.68rem; color: var(--text-dim); text-transform: uppercase; }
  .resource-bar-value { font-size: 0.9rem; font-weight: 700; margin-top: 2px; }
  .top-cells { margin-top: 12px; }
  .top-cell { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; margin-bottom: 4px;
              font-size: 0.78rem; border-radius: 6px; background: rgba(108,158,255,.05); }
  .top-cell:hover { background: rgba(108,158,255,.1); }
  .top-cell-info { flex: 1; min-width: 0; }
  .top-cell-name { font-family: 'JetBrains Mono', monospace; color: var(--text); font-weight: 600;
                   overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
  .top-cell-module { font-size: 0.7rem; color: var(--text-dim); margin-top: 1px; }
  .top-cell-resources { font-size: 0.68rem; color: var(--cyan); }
  .top-cell-crs { font-size: 0.65rem; color: var(--purple); }
  .top-cell-pct { font-weight: 700; color: var(--amber); margin-left: 12px; white-space: nowrap; font-size: 0.9rem; }
  .contrib-bar { height: 6px; border-radius: 3px; background: var(--border); margin-top: 4px; overflow: hidden; }
  .contrib-fill { height: 100%; border-radius: 3px; }
  .congestion-type-summary { display: flex; gap: 16px; margin: 12px 0; flex-wrap: wrap; }
  .type-card { flex: 1; min-width: 200px; padding: 14px; border-radius: 10px; text-align: center; }
  .type-card.short { background: rgba(248,113,113,.1); border: 1px solid rgba(248,113,113,.3); }
  .type-card.long { background: rgba(251,146,60,.1); border: 1px solid rgba(251,146,60,.3); }
  .type-card .type-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; margin-bottom: 4px; }
  .type-card .type-value { font-size: 1.3rem; font-weight: 700; }
  .type-card .type-note { font-size: 0.72rem; color: var(--text-dim); margin-top: 4px; }
  .type-card.short .type-label { color: var(--red); }
  .type-card.long .type-label { color: var(--orange); }
  /* Hotspot overlay on heatmap */
  .hotspot-overlay { position: absolute; border: 2px dashed; border-radius: 4px; pointer-events: none; z-index: 2; }
  .hotspot-east { border-color: var(--red); background: rgba(248,113,113,.08); }
  .hotspot-west { border-color: var(--orange); background: rgba(251,146,60,.08); }
  .hotspot-label { position: absolute; top: -14px; left: 4px; font-size: 0.6rem; font-weight: 700; padding: 0 4px; border-radius: 3px; }
  .hotspot-label.east { background: var(--red); color: #fff; }
  .hotspot-label.west { background: var(--orange); color: #fff; }
  /* Hierarchy tree */
  .hier-tree { font-size: 0.82rem; font-family: 'JetBrains Mono', monospace; }
  .hier-node { padding: 4px 0; }
  .hier-indent { display: inline-block; width: 20px; color: var(--border); }
  .hier-module { color: var(--accent); font-weight: 600; }
  .hier-instance { color: var(--text); }
  .hier-stats { color: var(--text-dim); font-size: 0.72rem; }
  .hier-congestion { display: inline-block; padding: 1px 6px; border-radius: 8px; font-size: 0.65rem; font-weight: 700; margin-left: 6px; }
  .hier-congestion.east { background: rgba(248,113,113,.2); color: var(--red); }
  .hier-congestion.west { background: rgba(251,146,60,.2); color: var(--orange); }
  .rec-card { background: var(--surface2); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0;
              padding: 14px 18px; margin-bottom: 12px; }
  .rec-card.critical { border-left-color: var(--red); }
  .rec-card.high { border-left-color: var(--amber); }
  .rec-card.medium { border-left-color: var(--cyan); }
  .rec-priority { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
  .rec-finding { font-size: 0.85rem; margin-bottom: 6px; }
  .rec-action { font-size: 0.82rem; color: var(--accent); }
  .rec-impact { font-size: 0.78rem; color: var(--text-dim); margin-top: 4px; }
  .no-data { text-align: center; padding: 40px; color: var(--text-dim); font-style: italic; }
  .slr-bar { display: flex; gap: 8px; align-items: flex-end; margin: 16px 0; }
  .slr-segment { flex: 1; background: var(--surface2); border-radius: 6px; padding: 10px; text-align: center; }
  .slr-label { font-size: 0.7rem; color: var(--text-dim); }
  .slr-value { font-size: 1.1rem; font-weight: 700; margin-top: 4px; }
  .util-bar { height: 8px; border-radius: 4px; background: var(--border); margin-top: 6px; overflow: hidden; }
  .util-fill { height: 100%; border-radius: 4px; transition: width .3s; }
  .util-fill.green { background: var(--green); }
  .util-fill.amber { background: var(--amber); }
  .util-fill.red { background: var(--red); }
  code { background: var(--surface2); padding: 2px 6px; border-radius: 4px; font-size: 0.82rem; font-family: 'JetBrains Mono', monospace; }
  .grid-label { font-size: 0.65rem; color: var(--text-dim); text-align: center; padding: 4px; font-weight: 600; }
  .device-grid-wrapper { position: relative; }
  .legend { display: flex; gap: 16px; margin: 10px 0; flex-wrap: wrap; align-items: center; font-size: 0.72rem; }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-swatch { width: 14px; height: 14px; border-radius: 3px; }
</style>
</head>
<body>
<div id="app"><div class="no-data">Loading report_data.json...</div></div>
<script>
fetch('report_data.json').then(r=>r.json()).then(render).catch(e=>{
  document.getElementById('app').innerHTML=`<div class="no-data">Error loading report_data.json: ${e.message}<br>Make sure the file is served via HTTP (python3 -m http.server)</div>`;
});

function render(D) {
  const md = D.metadata, a = D.assessment, pc = D.placement_congestion, rp = D.routing_pressure, rc = D.routing_congestion;
  const statusBadge = s => `<span class="badge badge-${s==='GREEN'?'green':s==='YELLOW'?'amber':'red'}">${s}</span>`;
  const valClass = (v, gT, yT, inv) => { if(v==null) return ''; if(inv) return v<=gT?'green':v<=yT?'amber':'red'; return v>=gT?'green':v>=yT?'amber':'red'; };
  const fmt = (v, d=2) => v==null?'N/A':typeof v==='number'?v.toFixed(d):v;
  const heatClass = v => v==null?'heat-na':`heat-${Math.min(5,Math.max(0,Math.round(v)))}`;

  // Build CR lookup
  const crMap = {};
  if (pc?.per_clock_region) pc.per_clock_region.forEach(cr => crMap[cr.region] = cr);
  const crRouteMap = {};
  if (pc?.per_clock_region_routing) pc.per_clock_region_routing.forEach(cr => crRouteMap[cr.region] = cr);
  const grid = md.clock_region_grid || {cols:4, rows:5, labels_x:['X0','X1','X2','X3'], labels_y:['Y0','Y1','Y2','Y3','Y4']};

  // Build congestion window CR membership sets
  const cw = pc?.congestion_windows || [];
  const cwCrSets = {};
  cw.forEach(w => {
    (w.affected_clock_regions || []).forEach(cr => {
      if (!cwCrSets[cr]) cwCrSets[cr] = [];
      cwCrSets[cr].push({direction: w.direction, type: w.type, level: w.level, pct: w.congestion_pct});
    });
  });

  let html = '';

  // Header
  html += `<div class="header"><div class="header-left">
    <h1>Congestion Analysis Dashboard</h1>
    <div class="subtitle">${md.design||'Design'} · ${md.device||'Device'} · ${md.analysis_phase||'post-place'} · ${md.vivado_version||''} · ${md.analysis_date||''}</div>
  </div><div>${statusBadge(a.overall_status)}</div></div>`;

  // KPI row
  const maxCong = pc?.global_congestion?.max_value;
  const maxDir = pc?.global_congestion?.max_direction || '';
  html += `<div class="kpi-row">
    <div class="kpi"><div class="kpi-label">Overall Score</div><div class="kpi-value ${valClass(a.overall_score,4,3)}">${a.overall_score}/5</div>
      <div class="kpi-sub">${a.summary||''}</div></div>
    <div class="kpi"><div class="kpi-label">Placement Score</div><div class="kpi-value ${valClass(a.placement_score,4,3)}">${a.placement_score!=null?a.placement_score+'/5':'N/A'}</div></div>
    <div class="kpi"><div class="kpi-label">Routing Score</div><div class="kpi-value ${valClass(a.routing_score,4,3)}">${a.routing_score!=null?a.routing_score+'/5':'N/A'}</div></div>
    <div class="kpi"><div class="kpi-label">Congestion Level</div><div class="kpi-value ${maxCong!=null?(maxCong>=4?'red':maxCong>=3?'amber':'green'):''}">${maxCong!=null?'Level '+maxCong:'N/A'}</div>
      <div class="kpi-sub">${maxDir?maxDir+' direction':''}</div></div>
    <div class="kpi"><div class="kpi-label">CLB Utilization</div><div class="kpi-value ${valClass(pc?.global_utilization?.clb_pct,50,80,true)}">${fmt(pc?.global_utilization?.clb_pct||pc?.global_utilization?.lut_pct,1)}%</div>
      <div class="kpi-sub">${pc?.global_utilization?.clb_used?.toLocaleString()||''}/${pc?.global_utilization?.clb_available?.toLocaleString()||''} CLBs</div></div>
    <div class="kpi"><div class="kpi-label">BRAM</div><div class="kpi-value ${valClass(pc?.global_utilization?.bram_pct,50,80,true)}">${fmt(pc?.global_utilization?.bram_pct,1)}%</div>
      <div class="kpi-sub">${pc?.global_utilization?.bram_used||''}/${pc?.global_utilization?.bram_available||''}</div></div>
  </div>`;

  // Tabs — Hotspots tab is first and active by default
  html += `<div class="tab-bar" id="mainTabs">
    <div class="tab active" data-tab="hotspots">Congestion Hotspots</div>
    <div class="tab" data-tab="overview">Overview</div>
    <div class="tab" data-tab="placement">Placement</div>
    <div class="tab" data-tab="routing">Routing</div>
    <div class="tab" data-tab="recommendations">Recommendations</div>
  </div>`;

  // ===== Tab: Congestion Hotspots =====
  html += `<div class="tab-content active" id="tab-hotspots">`;

  // Short vs Long congestion type summary
  const cts = pc?.congestion_type_summary;
  html += `<div class="card card-full"><h2>Congestion Type Breakdown: Short vs Long</h2>
    <div class="congestion-type-summary">
      <div class="type-card short">
        <div class="type-label">Short (Local Routing)</div>
        <div class="type-value" style="color:var(--red)">${cts?.short?.count || 0} window${(cts?.short?.count||0)!==1?'s':''}</div>
        <div class="type-note">${cts?.short?.max_level!=null?'Max Level '+cts.short.max_level+' ('+cts.short.max_pct+'%)':'No short congestion'}</div>
        <div class="type-note">${cts?.short?.directions?.length?'Directions: '+cts.short.directions.join(', '):''}</div>
        <div class="type-note" style="margin-top:6px;font-size:0.68rem">Short congestion = competition for local routing<br>resources within nearby CLBs (same-tile or adjacent)</div>
      </div>
      <div class="type-card long">
        <div class="type-label">Long (Global Routing)</div>
        <div class="type-value" style="color:${cts?.long?.count>0?'var(--orange)':'var(--green)'}">${cts?.long?.count || 0} window${(cts?.long?.count||0)!==1?'s':''}</div>
        <div class="type-note">${cts?.long?.max_level!=null?'Max Level '+cts.long.max_level+' ('+cts.long.max_pct+'%)':'No long congestion detected'}</div>
        <div class="type-note">${cts?.long?.directions?.length?'Directions: '+cts.long.directions.join(', '):''}</div>
        <div class="type-note" style="margin-top:6px;font-size:0.68rem">Long congestion = competition for inter-region<br>routing resources spanning multiple clock regions</div>
      </div>
    </div>
    ${cts?.note?`<div style="font-size:0.78rem;color:var(--text-dim);margin-top:8px;text-align:center"><em>${cts.note}</em></div>`:''}
  </div>`;

  // Congestion Hotspot Device Map
  html += `<div class="card card-full"><h2>Congestion Hotspot Map — Device Floorplan</h2>
    <p style="font-size:0.78rem;color:var(--text-dim);margin-bottom:12px">Clock region grid with congestion window overlays. Dashed borders show the physical extent of each congestion window on the device. Cell colors show BRAM utilization (the primary congestion driver).</p>
    <div class="legend">
      <div class="legend-item"><div class="legend-swatch" style="border:2px dashed var(--red);background:rgba(248,113,113,.08)"></div> East Short Window</div>
      <div class="legend-item"><div class="legend-swatch" style="border:2px dashed var(--orange);background:rgba(251,146,60,.08)"></div> West Short Window</div>
      <div class="legend-item"><div class="legend-swatch heat-5" style="width:14px;height:14px"></div> BRAM &ge;95%</div>
      <div class="legend-item"><div class="legend-swatch heat-3" style="width:14px;height:14px"></div> BRAM 80-95%</div>
      <div class="legend-item"><div class="legend-swatch heat-1" style="width:14px;height:14px"></div> BRAM 50-80%</div>
      <div class="legend-item"><div class="legend-swatch heat-0" style="width:14px;height:14px"></div> BRAM &lt;50%</div>
    </div>`;

  // Build the hotspot grid
  const cellW = 120, cellH = 60, gapPx = 3, labelW = 40;
  const gridW = labelW + grid.cols * (cellW + gapPx);
  const gridH = 20 + grid.rows * (cellH + gapPx);
  html += `<div class="device-grid-wrapper" id="hotspotGrid" style="position:relative;width:${gridW}px;margin:0 auto;">`;
  html += `<div class="heatmap-grid" style="grid-template-columns: ${labelW}px repeat(${grid.cols}, ${cellW}px);">`;
  html += `<div class="grid-label"></div>`;
  grid.labels_x.forEach(x => { html += `<div class="grid-label">${x}</div>`; });
  for (let r = grid.rows - 1; r >= 0; r--) {
    html += `<div class="grid-label">${grid.labels_y[r]}</div>`;
    for (let c = 0; c < grid.cols; c++) {
      const reg = grid.labels_x[c] + grid.labels_y[r];
      const cr = crMap[reg];
      const bram_pct = cr ? cr.bram_pct : null;
      const cls = bram_pct == null ? 'heat-na' : bram_pct >= 95 ? 'heat-5' : bram_pct >= 80 ? 'heat-3' : bram_pct >= 50 ? 'heat-1' : 'heat-0';
      const inWindow = cwCrSets[reg];
      const windowInfo = inWindow ? inWindow.map(w => `${w.direction} ${w.type} L${w.level}`).join(' + ') : '';
      html += `<div class="heatmap-cell ${cls}" data-cr="${reg}" style="width:${cellW}px;height:${cellH}px;display:flex;flex-direction:column;justify-content:center;align-items:center" title="${reg}: BRAM ${bram_pct!=null?bram_pct.toFixed(1)+'%':'N/A'}${windowInfo?' — IN '+windowInfo:''}">
        <div>${reg}</div>
        <div style="font-size:0.62rem">${bram_pct!=null?'BRAM '+Math.round(bram_pct)+'%':'—'}</div>
        ${inWindow?`<div style="font-size:0.55rem;color:var(--amber);margin-top:1px">${windowInfo}</div>`:''}
      </div>`;
    }
  }
  html += `</div>`;

  // Draw congestion window overlays
  cw.forEach((w, wi) => {
    const crs = w.affected_clock_regions || [];
    if (crs.length === 0) return;
    let minCol = grid.cols, maxCol = 0, minRow = grid.rows, maxRow = 0;
    crs.forEach(cr => {
      const m = cr.match(/X(\d+)Y(\d+)/);
      if (m) {
        const col = parseInt(m[1]), row = parseInt(m[2]);
        minCol = Math.min(minCol, col);
        maxCol = Math.max(maxCol, col);
        minRow = Math.min(minRow, row);
        maxRow = Math.max(maxRow, row);
      }
    });
    const left = labelW + minCol * (cellW + gapPx) - 2;
    const right = labelW + (maxCol + 1) * (cellW + gapPx) - gapPx + 2;
    const top = 20 + (grid.rows - 1 - maxRow) * (cellH + gapPx) - 2;
    const bottom = 20 + (grid.rows - minRow) * (cellH + gapPx) - gapPx + 2;
    const dirClass = w.direction.toLowerCase() === 'west' ? 'hotspot-west' : 'hotspot-east';
    const labelClass = w.direction.toLowerCase() === 'west' ? 'west' : 'east';
    html += `<div class="hotspot-overlay ${dirClass}" style="left:${left}px;top:${top}px;width:${right-left}px;height:${bottom-top}px">

  html += `</div>`;
  html += `</div>`;

  // Congestion Window Details with module correlation
  if (cw.length > 0) {
    html += `<div class="card card-full"><h2>Congestion Windows — Module Correlation &amp; Contributors</h2>

      const rb = w.resource_breakdown || {};
      const typeClass = w.type === 'Short' ? 'short-type' : 'long-type';
      const typeBadgeClass = w.type === 'Short' ? 'type-badge-short' : 'type-badge-long';
      const rbBar = (label, val) => {
        if (val == null) return '';
        const c = val >= 90 ? 'red' : val >= 70 ? 'amber' : 'green';
        return `<div class="resource-bar-item"><div class="resource-bar-label">${label}</div><div class="resource-bar-value ${c}">${val}%</div></div>`;
      };
      html += `<div class="window-card ${typeClass}">
        <div class="window-header">
          <div>
            <div class="window-title">${w.direction} Congestion Window</div>
            <div class="window-coords">${w.window}</div>
            ${w.affected_clock_regions?`<div class="window-crs">Affected CRs: ${w.affected_clock_regions.join(', ')}</div>`:''}
          </div>
          <div class="window-badges">
            <div class="window-badge ${typeBadgeClass}">${w.type}</div>
            <div class="window-badge" style="background:rgba(248,113,113,.2);color:var(--red)">Level ${w.level} &middot; ${w.congestion_pct}%</div>
          </div>

        <div class="resource-bars">
          ${rbBar('LUT', rb.lut_pct)}${rbBar('LUTRAM', rb.lutram_pct)}${rbBar('Flop', rb.flop_pct)}
          ${rbBar('BRAM', rb.bram_pct)}${rbBar('DSP', rb.dsp_pct)}${rbBar('Carry', rb.carry_pct)}${rbBar('SRL', rb.srl_pct)}
        </div>`;

      if (w.top_cells && w.top_cells.length > 0) {
        const barColors = ['#f87171', '#fbbf24', '#a78bfa', '#22d3ee', '#4ade80'];
        html += `<div class="top-cells">
          <div style="font-size:0.72rem;color:var(--text-dim);text-transform:uppercase;margin-bottom:8px;font-weight:600">Top Contributing Modules (% Congestion Contribution)</div>`;

          const parentMod = c.parent_module || '';

          html += `<div class="top-cell">
            <div class="top-cell-info">
              <span class="top-cell-name" title="${c.name}">${shortName}</span>
              <div class="top-cell-module">Module: <strong>${moduleName}</strong>${parentMod?' (parent: '+parentMod+')':''}</div>
              ${resStr?`<div class="top-cell-resources">${resStr}</div>`:''}
              ${crStr?`<div class="top-cell-crs">Placed in: ${crStr}</div>`:''}
              <div class="contrib-bar"><div class="contrib-fill" style="width:${c.pct}%;background:${barColors[ci%barColors.length]}"></div></div>
            </div>
            <div class="top-cell-pct">${c.pct}%</div>
          </div>`;
        });
        const remaining = 100 - w.top_cells.reduce((s,c)=>s+c.pct, 0);
        if (remaining > 0) {
          html += `<div class="top-cell">
            <div class="top-cell-info">
              <span class="top-cell-name" style="color:var(--text-dim)">Other cells (not individually reported)</span>
              <div class="contrib-bar"><div class="contrib-fill" style="width:${remaining}%;background:var(--border)"></div></div>
            </div>
            <div class="top-cell-pct" style="color:var(--text-dim)">${remaining}%</div>
          </div>`;
        }
        html += `</div>`;
      }
      html += `</div>`;
    });
    html += `</div>`;
  }

  // Module Hierarchy Tree with congestion correlation
  if (pc?.module_hierarchy && pc.module_hierarchy.length > 0) {
    html += `<div class="card card-full"><h2>Module Hierarchy — Congestion Attribution</h2>
      <p style="font-size:0.78rem;color:var(--text-dim);margin-bottom:14px">Hierarchical breakdown showing which modules contribute to congestion windows. Tagged modules are the ones Vivado identified as top contributors.</p>
      <div class="hier-tree">`;
    function renderTree(nodes, depth) {
      let h = '';
      nodes.forEach(n => {
        const indent = Array(depth).fill('<span class="hier-indent">│</span>').join('');
        const prefix = depth > 0 ? (indent.slice(0, -25) + '<span class="hier-indent">├</span>') : '';
        const luts = n.lut != null ? n.lut.toLocaleString() : '?';
        const ffs = n.ff != null ? n.ff.toLocaleString() : '?';
        const bram = (n.bram36||0) + Math.ceil((n.bram18||0)/2);
        const dsp = n.dsp != null ? n.dsp : '?';
        const congBadge = n.congestion_window ?
          `<span class="hier-congestion ${n.congestion_window.toLowerCase()}">${n.congestion_window} ${n.congestion_pct}%</span>` : '';
        const roleBadge = n.congestion_role ?
          `<span style="font-size:0.65rem;color:var(--purple);margin-left:6px">⚠ ${n.congestion_role}</span>` : '';
        h += `<div class="hier-node">${prefix}
          <span class="hier-instance">${n.instance}</span>
          <span class="hier-module">[${n.module}]</span>
          <span class="hier-stats"> LUT:${luts} FF:${ffs} BRAM:${bram} DSP:${dsp}</span>
          ${congBadge}${roleBadge}
        </div>`;
        if (n.children) h += renderTree(n.children, depth + 1);
      });
      return h;
    }
    html += renderTree(pc.module_hierarchy, 0);
    html += `</div></div>`;
  }

  html += `</div>`;

  // ===== Tab: Overview =====
  html += `<div class="tab-content" id="tab-overview">`;
  if (pc?.global_utilization) {
    const gu = pc.global_utilization;
    const uBar = (label, pct, used, avail) => {
      if (pct == null || (avail != null && avail === 0 && used === 0)) return '';
      const c = pct>80?'red':pct>65?'amber':'green';
      const detail = used!=null && avail!=null ? ` (${used.toLocaleString()}/${avail.toLocaleString()})` : '';
      return `<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:0.82rem">
        <span>${label}${detail}</span><span class="${c}">${fmt(pct,1)}%</span></div>
        <div class="util-bar"><div class="util-fill ${c}" style="width:${Math.min(100,pct)}%"></div></div></div>`;
    };
    html += `<div class="card card-full"><h2>Global Utilization</h2>
      ${uBar('CLB', gu.clb_pct, gu.clb_used, gu.clb_available)}
      ${uBar('LUT', gu.lut_pct, gu.lut_used, gu.lut_available)}
      ${uBar('FF', gu.ff_pct, gu.ff_used, gu.ff_available)}
      ${uBar('BRAM', gu.bram_pct, gu.bram_used, gu.bram_available)}
      ${uBar('DSP', gu.dsp_pct, gu.dsp_used, gu.dsp_available)}
      ${gu.uram_pct>0?uBar('URAM', gu.uram_pct, gu.uram_used, gu.uram_available):''}
    </div>`;
  }
  html += `<div class="grid-2">`;
  if (pc?.global_congestion) {
    const gc = pc.global_congestion;
    const compassCell = (dir, val) => {
      const cls = val==null ? 'heat-na' : heatClass(val);
      const label = val==null ? '< 5' : 'Level ' + val;
      return `<div class="compass-cell ${cls}"><div class="compass-label">${dir}</div>${label}</div>`;
    };
    html += `<div class="card"><h2>Placer Congestion (Worst Direction)</h2>
      <div class="compass">
        <div class="compass-empty"></div>${compassCell('North', gc.north)}<div class="compass-empty"></div>
        ${compassCell('West', gc.west)}<div class="compass-cell compass-empty" style="font-size:0.7rem;color:var(--text-dim);display:flex;align-items:center;justify-content:center">Device</div>${compassCell('East', gc.east)}
        <div class="compass-empty"></div>${compassCell('South', gc.south)}<div class="compass-empty"></div>
      </div>
      <div style="text-align:center;font-size:0.75rem;color:var(--text-dim);margin-top:8px">${pc.router_initial_congestion||''}</div>
    </div>`;
  }
  html += `<div class="card"><h2>Complexity &amp; Routing Pressure</h2>
    <table><tr><th>Metric</th><th class="num">Value</th><th>Note</th></tr>
    <tr><td>Rent Exponent</td><td class="num">${fmt(pc?.rent_exponent)}</td>
      <td style="font-size:0.75rem;color:var(--text-dim)">${pc?.rent_note||''}</td></tr>
    <tr><td>Max Logic Levels</td><td class="num">${pc?.logic_levels?.max??'N/A'}</td><td>—</td></tr>
    <tr><td>HLUTNM Count</td><td class="num">${rp?.hlutnm_count!=null?rp.hlutnm_count.toLocaleString():'N/A'}</td>

    <tr><td>MUXF7</td><td class="num">${rp?.muxf7_count!=null?rp.muxf7_count.toLocaleString():'N/A'}</td><td>—</td></tr>
    <tr><td>MUXF8</td><td class="num">${rp?.muxf8_count!=null?rp.muxf8_count.toLocaleString():'N/A'}</td><td>—</td></tr>
    <tr><td>Carry Chains</td><td class="num">${rp?.carry_count!=null?rp.carry_count.toLocaleString():'N/A'}</td><td>—</td></tr>
    <tr><td>Primary Clock</td><td class="num" colspan="2">${rp?.primary_clock||'N/A'}${rp?.primary_clock_loads?' — '+rp.primary_clock_loads.toLocaleString()+' loads':''}</td></tr>
    </table>
  </div>`;
  html += `</div></div>`;

  // ===== Tab: Placement =====
  html += `<div class="tab-content" id="tab-placement">`;
  if (pc?.per_clock_region && pc.per_clock_region.length > 0) {
    const buildHeatmap = (title, getVal, getSub, thresholds) => {
      const [yT, rT] = thresholds || [70, 90];
      let h = `<div class="card card-full"><h2>${title}</h2>`;
      h += `<div class="heatmap-grid" style="grid-template-columns: 40px repeat(${grid.cols}, 1fr);">`;
      h += `<div class="grid-label"></div>`;
      grid.labels_x.forEach(x => { h += `<div class="grid-label">${x}</div>`; });
      for (let r = grid.rows - 1; r >= 0; r--) {
        h += `<div class="grid-label">${grid.labels_y[r]}</div>`;
        for (let c = 0; c < grid.cols; c++) {
          const reg = grid.labels_x[c] + grid.labels_y[r];
          const cr = crMap[reg];
          const val = cr ? getVal(cr) : null;
          const sub = cr && getSub ? getSub(cr) : '';
          const cls = val == null ? 'heat-na' : val >= rT ? 'heat-5' : val >= yT ? 'heat-3' : val >= 50 ? 'heat-1' : 'heat-0';
          h += `<div class="heatmap-cell ${cls}" title="${reg}: ${val!=null?val.toFixed(1)+'%':'N/A'}">${val!=null?Math.round(val)+'%':'—'}${sub?'<br>'+sub:''}</div>`;
        }
      }
      h += `</div></div>`;
      return h;
    };
    html += buildHeatmap('FF Utilization by Clock Region', cr => cr.ff_pct, cr => cr.ff_used.toLocaleString(), [50, 70]);
    html += buildHeatmap('BRAM Utilization by Clock Region (18K tiles)', cr => cr.bram_pct, null, [80, 95]);
    html += buildHeatmap('DSP Utilization by Clock Region', cr => cr.dsp_pct, null, [70, 85]);

    html += `<div class="grid-2">
      <div class="card"><h2>BRAM per Clock Region</h2>
        <div class="chart-container"><canvas id="crBramChart"></canvas></div></div>
      <div class="card"><h2>DSP per Clock Region</h2>
        <div class="chart-container"><canvas id="crDspChart"></canvas></div></div>
    </div>`;

    html += `<div class="card card-full"><h2>Clock Region Detail</h2><table>
      <tr><th>Region</th><th class="num">FF Used</th><th class="num">FF%</th>
      <th class="num">LUTRAM%</th><th class="num">BRAM Used</th><th class="num">BRAM%</th>
      <th class="num">DSP Used</th><th class="num">DSP%</th><th>Congestion</th></tr>`;
    pc.per_clock_region.forEach(cr => {
      const inCW = cwCrSets[cr.region];
      const cwStr = inCW ? inCW.map(w=>`<span class="${w.direction==='East'?'neg':'warn'}">${w.direction} ${w.type}</span>`).join(' ') : '—';
      html += `<tr><td>${cr.region}</td>
        <td class="num">${cr.ff_used.toLocaleString()}</td>
        <td class="num ${cr.ff_pct>70?'neg':cr.ff_pct>50?'warn':'pos'}">${fmt(cr.ff_pct,1)}</td>
        <td class="num">${fmt(cr.lutram_pct,1)}</td>
        <td class="num">${cr.bram_used}/${cr.bram_avail}</td>
        <td class="num ${cr.bram_pct>=95?'neg':cr.bram_pct>=80?'warn':'pos'}">${fmt(cr.bram_pct,1)}</td>
        <td class="num">${cr.dsp_used}/${cr.dsp_avail}</td>
        <td class="num ${cr.dsp_pct>=85?'neg':cr.dsp_pct>=70?'warn':'pos'}">${fmt(cr.dsp_pct,1)}</td>
        <td>${cwStr}</td>
      </tr>`;

    html += `</table></div>`;
  } else {
    html += `<div class="no-data">No per-clock-region data available.</div>`;
  }
  if (pc?.per_slr && pc.per_slr.length > 0) {
    html += `<div class="card card-full"><h2>SLR Utilization Breakdown</h2><div class="slr-bar">`;
    pc.per_slr.forEach(s => {
      const c = s.lut_pct>80?'red':s.lut_pct>65?'amber':'green';
      html += `<div class="slr-segment"><div class="slr-label">${s.slr}</div>
        <div class="slr-value ${c}">${fmt(s.lut_pct,1)}%</div>
        <div class="util-bar"><div class="util-fill ${c}" style="width:${Math.min(100,s.lut_pct)}%"></div></div>
        <div style="margin-top:4px;font-size:0.7rem;color:var(--text-dim)">Cong: ${s.congestion_max} (${s.worst_direction||''})</div>
      </div>`;
    });
    html += `</div></div>`;
  }
  html += `</div>`;

  // ===== Tab: Routing =====
  html += `<div class="tab-content" id="tab-routing">`;
  if (pc?.per_clock_region_routing && pc.per_clock_region_routing.length > 0) {
    const buildRouteHeatmap = (title, getVal) => {
      let h = `<div class="card card-full"><h2>${title}</h2>`;
      h += `<div class="heatmap-grid" style="grid-template-columns: 40px repeat(${grid.cols}, 1fr);">`;
      h += `<div class="grid-label"></div>`;
      grid.labels_x.forEach(x => { h += `<div class="grid-label">${x}</div>`; });
      for (let r = grid.rows - 1; r >= 0; r--) {
        h += `<div class="grid-label">${grid.labels_y[r]}</div>`;
        for (let c = 0; c < grid.cols; c++) {
          const reg = grid.labels_x[c] + grid.labels_y[r];
          const cr = crRouteMap[reg];
          const val = cr ? getVal(cr) : null;
          const cls = val == null ? 'heat-na' : val >= 80 ? 'heat-5' : val >= 50 ? 'heat-3' : val >= 25 ? 'heat-1' : 'heat-0';
          h += `<div class="heatmap-cell ${cls}" title="${reg}: ${val!=null?val.toFixed(1)+'%':'N/A'}">${val!=null?Math.round(val)+'%':'—'}</div>`;
        }
      }
      h += `</div></div>`;
      return h;
    };
    html += `<div class="grid-2">`;
    html += buildRouteHeatmap('HROUTE Utilization', cr => cr.hroute_pct);
    html += buildRouteHeatmap('HDISTR Utilization', cr => cr.hdistr_pct);
    html += `</div><div class="grid-2">`;
    html += buildRouteHeatmap('VROUTE Utilization', cr => cr.vroute_pct);
    html += buildRouteHeatmap('VDISTR Utilization', cr => cr.vdistr_pct);
    html += `</div>`;

    html += `<div class="card card-full"><h2>Clock Routing Resource Detail</h2><table>
      <tr><th>Region</th><th class="num">HROUTE%</th><th class="num">HDISTR%</th>
      <th class="num">VROUTE%</th><th class="num">VDISTR%</th><th>Status</th></tr>`;
    pc.per_clock_region_routing.forEach(cr => {
      const maxVal = Math.max(cr.hroute_pct, cr.hdistr_pct, cr.vroute_pct, cr.vdistr_pct);
      const status = maxVal >= 90 ? '<span class="neg">CRITICAL</span>' : maxVal >= 50 ? '<span class="warn">WARNING</span>' : '<span class="pos">OK</span>';
      const cls = v => v >= 80 ? 'neg' : v >= 50 ? 'warn' : 'pos';
      html += `<tr><td>${cr.region}</td>
        <td class="num ${cls(cr.hroute_pct)}">${fmt(cr.hroute_pct,1)}</td>
        <td class="num ${cls(cr.hdistr_pct)}">${fmt(cr.hdistr_pct,1)}</td>
        <td class="num ${cls(cr.vroute_pct)}">${fmt(cr.vroute_pct,1)}</td>
        <td class="num ${cls(cr.vdistr_pct)}">${fmt(cr.vdistr_pct,1)}</td>
        <td>${status}</td></tr>`;
    });
    html += `</table></div>`;
  }
  if (rc) {
    const rs = rc.route_status;
    html += `<div class="grid-2">
      <div class="card"><h2>Route Status</h2>
        <div class="chart-container"><canvas id="routeStatusChart"></canvas></div>
      </div>
      <div class="card"><h2>Route Summary</h2><table>
        <tr><td>Routed Nets</td><td class="num pos">${rs.nets_routed?.toLocaleString()}</td></tr>
        <tr><td>Unrouted Nets</td><td class="num ${rs.nets_unrouted>0?'neg':'pos'}">${rs.nets_unrouted}</td></tr>
        <tr><td>Partial Nets</td><td class="num ${rs.nets_partial>0?'warn':''}">${rs.nets_partial}</td></tr>
        <tr><td>Conflicts</td><td class="num ${rs.nets_conflicts>0?'neg':''}">${rs.nets_conflicts}</td></tr>
        <tr><td>Antennas</td><td class="num ${rs.nets_antennas>0?'neg':''}">${rs.nets_antennas}</td></tr>
        <tr><td>Completion</td><td class="num">${fmt(rs.route_completion_pct,2)}%</td></tr>
      </table></div>
    </div>`;
    const t = rc.timing;
    if (t) {
      html += `<div class="card card-full"><h2>Post-Route Timing</h2>
        <div class="kpi-row">
          <div class="kpi"><div class="kpi-label">WNS</div><div class="kpi-value ${t.wns>=0?'green':'red'}">${fmt(t.wns,3)} ns</div></div>
          <div class="kpi"><div class="kpi-label">WHS</div><div class="kpi-value ${t.whs>=0?'green':'red'}">${fmt(t.whs,3)} ns</div></div>
          <div class="kpi"><div class="kpi-label">TNS</div><div class="kpi-value ${t.tns>=0?'green':'red'}">${fmt(t.tns,1)} ns</div></div>
          <div class="kpi"><div class="kpi-label">THS</div><div class="kpi-value ${t.ths>=0?'green':'red'}">${fmt(t.ths,1)} ns</div></div>
        </div></div>`;
    }
  } else {
    html += `<div class="no-data">Design has not been routed yet.</div>`;
  }
  html += `</div>`;

  // ===== Tab: Recommendations =====
  html += `<div class="tab-content" id="tab-recommendations">`;
  if (D.recommendations && D.recommendations.length > 0) {
    D.recommendations.forEach(r => {
      const sevClass = r.severity==='CRITICAL'?'critical':r.severity==='HIGH'?'high':'medium';
      const sevColor = r.severity==='CRITICAL'?'red':r.severity==='HIGH'?'amber':'cyan';
      html += `<div class="rec-card ${sevClass}">
        <div class="rec-priority" style="color:var(--${sevColor})">Priority ${r.priority} · ${r.severity} · ${r.category}</div>
        <div class="rec-finding">${r.finding}</div>
        <div class="rec-action"><code>${r.action}</code></div>
        <div class="rec-impact">${r.expected_impact||''}</div>
      </div>`;
    });
  } else {
    html += `<div class="no-data">No recommendations generated.</div>`;
  }
  if (D.thresholds) {
    const th = D.thresholds;
    html += `<div class="card card-full" style="margin-top:20px"><h2>Reference Thresholds</h2><table>
      <tr><th>Metric</th><th class="num">Green</th><th class="num">Yellow</th><th class="num">Red</th></tr>
      <tr><td>Congestion Level</td><td class="num pos">0-${th.congestion_green}</td><td class="num warn">${th.congestion_yellow}</td><td class="num neg">4-5</td></tr>
      <tr><td>BRAM per CR</td><td class="num pos">&lt; 80%</td><td class="num warn">80-${th.bram_per_cr_yellow||90}%</td><td class="num neg">&gt; ${th.bram_per_cr_yellow||90}%</td></tr>
      <tr><td>Clock Routing</td><td class="num pos">&lt; ${th.clock_routing_yellow||50}%</td><td class="num warn">${th.clock_routing_yellow||50}-${th.clock_routing_red||80}%</td><td class="num neg">&gt; ${th.clock_routing_red||80}%</td></tr>
      <tr><td>Rent Exponent</td><td class="num pos">&lt; ${th.rent_green}</td><td class="num warn">${th.rent_green}-${th.rent_yellow}</td><td class="num neg">&gt; ${th.rent_yellow}</td></tr>
      <tr><td>Route Degradation</td><td class="num pos">&lt; ${th.degradation_green_ns} ns</td><td class="num warn">${th.degradation_green_ns}-${th.degradation_yellow_ns} ns</td><td class="num neg">&gt; ${th.degradation_yellow_ns} ns</td></tr>
    </table></div>`;
  }
  html += `</div>`;

  document.getElementById('app').innerHTML = html;

  // Tab switching
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
    });
  });

  // ===== Charts =====
  const chartOpts = {
    responsive: true,
    plugins: { legend: { labels: { color: '#8b90a0', font: { size: 11 } } } },
    scales: {
      x: { ticks: { color: '#8b90a0', font: { size: 10 } }, grid: { color: '#2e3347' } },
      y: { ticks: { color: '#8b90a0', font: { size: 10 } }, grid: { color: '#2e3347' } }
    }
  };

  // Contribution bar charts for each congestion window
  cw.forEach((w, wi) => {
    const canvas = document.getElementById('contribChart' + wi);
    if (!canvas || !w.top_cells) return;
    const barColors = ['#f87171', '#fbbf24', '#a78bfa', '#22d3ee', '#4ade80'];
    const labels = w.top_cells.map(c => c.short_name || c.name.split('/').pop());
    const remaining = 100 - w.top_cells.reduce((s,c)=>s+c.pct, 0);
    if (remaining > 0) labels.push('Other');
    const data = w.top_cells.map(c => c.pct);
    if (remaining > 0) data.push(remaining);
    const colors = w.top_cells.map((_, i) => barColors[i % barColors.length]);
    if (remaining > 0) colors.push('#2e3347');
    new Chart(canvas, {
      type: 'bar',
      data: { labels, datasets: [{ label: '% Contribution', data, backgroundColor: colors, borderRadius: 3 }] },
      options: {
        ...chartOpts,
        indexAxis: 'y',
        plugins: { ...chartOpts.plugins, legend: { display: false } },
        scales: {
          x: { ...chartOpts.scales.x, min: 0, max: 100, title: { display: true, text: '% Contribution', color: '#8b90a0' } },
          y: { ...chartOpts.scales.y, ticks: { ...chartOpts.scales.y.ticks, font: { size: 10, family: "'JetBrains Mono', monospace" } } }
        }
      }
    });
  });

  // BRAM per CR bar chart
  if (pc?.per_clock_region && document.getElementById('crBramChart')) {
    const regions = pc.per_clock_region.map(r => r.region);
    const vals = pc.per_clock_region.map(r => r.bram_pct);
    const colors = vals.map(v => v >= 95 ? '#f87171' : v >= 80 ? '#fbbf24' : '#4ade80');
    new Chart(document.getElementById('crBramChart'), {
      type: 'bar',
      data: { labels: regions, datasets: [{ label: 'BRAM %', data: vals, backgroundColor: colors, borderRadius: 3 }] },
      options: { ...chartOpts, scales: { ...chartOpts.scales, y: { ...chartOpts.scales.y, min: 0, max: 105, title: { display: true, text: 'BRAM %', color: '#8b90a0' } } } }
    });
  }

  // DSP per CR bar chart
  if (pc?.per_clock_region && document.getElementById('crDspChart')) {
    const regions = pc.per_clock_region.map(r => r.region);
    const vals = pc.per_clock_region.map(r => r.dsp_pct);
    const colors = vals.map(v => v >= 85 ? '#f87171' : v >= 70 ? '#fbbf24' : '#4ade80');
    new Chart(document.getElementById('crDspChart'), {
      type: 'bar',
      data: { labels: regions, datasets: [{ label: 'DSP %', data: vals, backgroundColor: colors, borderRadius: 3 }] },
      options: { ...chartOpts, scales: { ...chartOpts.scales, y: { ...chartOpts.scales.y, min: 0, max: 100, title: { display: true, text: 'DSP %', color: '#8b90a0' } } } }
    });
  }

  // Route status donut
  if (rc?.route_status && document.getElementById('routeStatusChart')) {
    const rs = rc.route_status;
    const vals = [rs.nets_routed, rs.nets_unrouted, rs.nets_partial, rs.nets_conflicts, rs.nets_antennas].filter(v=>v>0);
    const labs = ['Routed','Unrouted','Partial','Conflicts','Antennas'].filter((_,i)=>[rs.nets_routed,rs.nets_unrouted,rs.nets_partial,rs.nets_conflicts,rs.nets_antennas][i]>0);
    const cols = ['#4ade80','#f87171','#fbbf24','#a78bfa','#22d3ee'].filter((_,i)=>[rs.nets_routed,rs.nets_unrouted,rs.nets_partial,rs.nets_conflicts,rs.nets_antennas][i]>0);
    new Chart(document.getElementById('routeStatusChart'), {
      type: 'doughnut',
      data: { labels: labs, datasets: [{ data: vals, backgroundColor: cols, borderWidth: 0 }] },
      options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { color: '#8b90a0' } } } }
    });
  }
}
</script>
</body>
</html>
