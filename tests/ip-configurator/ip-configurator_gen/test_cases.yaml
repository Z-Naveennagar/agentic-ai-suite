- id: ip-configurator-test-kit_16
  input_files: []
  cell_name: bench_cell_016
  prompt: Versal clocking wizard producing 100, 200 and 250 MHz outputs (data-path clocks) with an active-low reset, and the locked and reset signals exposed.
  expected:
    skills:
    - ip-configurator
    # Version-keyed identity: 2026.1 ships the Clocking Wizard as THREE catalog
    # entries partitioned by device generation, all with the identical
    # DISPLAY_NAME "Clocking Wizard" and DISJOINT SUPPORTED_PARTS --
    # clk_wiz (7-series/UltraScale), clk_wizard (Versal Gen1: 0 xc2ve parts,
    # 264 xcve / 283 xcvc) and clkx5_wiz (Versal Gen2: 375 xc2ve parts, 0 of
    # Gen1's). On the xc2ve3558 baseline part clkx5_wiz IS this device's edition
    # of the same IP, so it is the correct answer and NO part swap is warranted;
    # expecting clk_wizard here would require downgrading the device to reach an
    # older edition of the same core. `ipcfg::ip_availability` reports the pair
    # as VARIANT_OF and tells the agent to use the AVAILABLE one.
    # The genuine part-swap path is covered by case 32 (cmac_usplus), where the
    # WRONG_PART IP has no same-DISPLAY_NAME edition for this device.
    # Param names are identical across the two editions, so only identity moves.
    expected_output_by_vivado_version:
      "2026.1":
        identified_ip: clkx5_wiz
        vlnv: xilinx.com:ip:clkx5_wiz
        as_configured:
          CONFIG.CLKOUT_USED: true,true,true,false,false,false,false
          CONFIG.CLKOUT_REQUESTED_OUT_FREQUENCY: 100.000,200.000,250.000,100.000,100.000,100.000,100.000
          CONFIG.USE_RESET: 'true'
          CONFIG.RESET_TYPE: ACTIVE_LOW
          CONFIG.USE_LOCKED: 'true'
        tier1_success: true
        tier2_success: null
        self_fidelity: full
        notes: "Clocking Wizard on Versal AI Edge Gen2. On 2026.1 the Gen2 edition is clkx5_wiz; clk_wizard (Gen1) supports 0 xc2ve parts and is a device-generation VARIANT of the same IP (identical DISPLAY_NAME), so it is NOT substituted and NO part swap is done. Comma-list params; 3 outputs 100/200/250 MHz, active-low reset (RESET_TYPE ACTIVE_LOW + USE_RESET), USE_LOCKED exposes locked+reset."
      default:
        identified_ip: clk_wizard
        vlnv: xilinx.com:ip:clk_wizard
        as_configured:
          CONFIG.CLKOUT_USED: true,true,true,false,false,false,false
          CONFIG.CLKOUT_REQUESTED_OUT_FREQUENCY: 100.000,200.000,250.000,100.000,100.000,100.000,100.000
          CONFIG.USE_RESET: 'true'
          CONFIG.RESET_TYPE: ACTIVE_LOW
          CONFIG.USE_LOCKED: 'true'
        tier1_success: true
        tier2_success: null
        self_fidelity: full
        notes: "Versal Clocking Wizard (PG321). clk_wizard:1.0 unsupported on xc2ve3558; swapped to xcvc1902 then restored. Comma-list params; 3 outputs 100/200/250 MHz, active-low reset (RESET_TYPE ACTIVE_LOW + USE_RESET), USE_LOCKED exposes locked+reset."
