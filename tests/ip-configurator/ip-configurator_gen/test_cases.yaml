- id: ip-configurator-test-kit_20
  input_files: []
  cell_name: bench_cell_020
  prompt: 'MIPI CSI-2 RX subsystem for a GMSL camera bridged via C-PHY: 3 lanes, 4 pixels per clock, RAW12, all virtual channels, 4096-deep line buffer, user-data-type filtering on, ISP bridge enabled, register interface on, D-PHY line rate 1500 Mbps, SupportLevel 1.'
  expected:
    skills:
    - ip-configurator
    expected_output:
      identified_ip: mipi_csi2_rx_subsystem
      vlnv: xilinx.com:ip:mipi_csi2_rx_subsystem
      as_configured:
        CONFIG.C_PHY_MODE: CPHY
        CONFIG.SupportLevel: '1'
        CONFIG.CMN_NUM_LANES: '3'
        CONFIG.CMN_NUM_PIXELS: '4'
        CONFIG.CMN_PXL_FORMAT: RAW12
        CONFIG.CMN_VC: All
        CONFIG.CSI_BUF_DEPTH: '4096'
        CONFIG.C_CSI_FILTER_USERDATATYPE: 'true'
        CONFIG.C_SPRT_ISP_BRIDGE: 'true'
        CONFIG.DPY_EN_REG_IF: 'true'
        CONFIG.DPY_LINE_RATE: '1500'
      tier1_success: true
      tier2_success: null
      self_fidelity: full
      notes: "C-PHY 3-lane GMSL bridge. PG232 grounded: PHY Mode=CPHY, Serial Data Lanes=3, Pixels Per Clock=4, Pixel Format=RAW12, Allowed VC=All, Line Buffer Depth=4096, user-data-type filter on, ISP bridge on, register I/F on, line rate 1500. PHY-mode applied first (enabler). All 11 target params read back exactly. C_DPHY_LANES is NOT graded: Vivado derives it from CMN_NUM_LANES (it tracks the value in both DPHY and CPHY mode) but leaves VALUE_SRC=DEFAULT, so the read-back only sees it if an agent redundantly restates a value Vivado already maintains -- it carries no signal CMN_NUM_LANES does not. TRI_SELECT/BITSLIP_VAL disabled warnings are internal PHY sub-core artifacts, not targets. Doc search shared with 021."
