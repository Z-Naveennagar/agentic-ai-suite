  cell_name: bench_cell_001
  prompt: Configure an AXI GPIO as a 2-bit, all-outputs port to drive the auto-IOB MSI-X enable lines.
  expected:
    skills:
    - ip-configurator
    expected_output:
      identified_ip: axi_gpio
      vlnv: xilinx.com:ip:axi_gpio
      as_configured:
        CONFIG.C_GPIO_WIDTH: '2'
        CONFIG.C_ALL_OUTPUTS: '1'
