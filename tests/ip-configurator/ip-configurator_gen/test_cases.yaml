# THE part-swap case. Cases 16/17 used to carry this role and could not: their
# clk_wizard/clkx5_wiz pair is one IP split across device generations, so the
# right answer there is to use this device's edition, not to swap (see 16's
# comment). This case makes the swap genuinely necessary and unambiguous:
#
#   - `cmac_usplus` (UltraScale+ 100G Ethernet Subsystem) supports 83 devices,
#     NONE of them the xc2ve3558 baseline part -> WRONG_PART.
#   - No IP available on the baseline part shares its DISPLAY_NAME, so it is NOT
#     a device-generation variant: there is no local edition to fall back to and
#     the swap is the only correct route.
#   - The distractor is real. On the baseline part `ipcfg::ip_availability
#     {*cmac* *100g*}` reports cmac / cmac_usplus / dcmac all WRONG_PART while
#     `flexo_100g_rs_fec` is AVAILABLE -- a DIFFERENT IP (RS-FEC block only) that
#     would build, configure and verify clean while being the wrong answer. That
#     is exactly the substitution SELECT_RULE exists to prevent, so this case
#     fails if the agent takes the available IP instead of swapping.
#
# The harness makes the swap safe: `verify:` reads the design back BEFORE
# `reset:` restores the baseline part, so the agent must leave the part swapped
# (restoring it while the cell exists would drop the cell -- ipcfg::restore_part
# now refuses with WARN:RESTORE_BLOCKED rather than doing that silently).
#
# The prompt sanctions the swap in so many words because the first run showed it
# has to: a rep that swapped and built this golden exactly was still graded F by
# the LLM judge, which read the baseline part as a hard task constraint and
# called the swap an unauthorised deviation ("cannot be used in the specified
# Versal Gen2 block design", practical_value 30). With the swap approved in the
# prompt, the judge and the agent are measuring the same task. Note this makes
# the case a test of *executing* a necessary swap, not of resisting substitution
# -- the run also showed both reps reaching first for `mrmac` (Versal's own
# 100G-capable MAC, AVAILABLE on the baseline part, so no availability verdict
# contradicts it), which is a selection-policy gap tracked separately.
#
# Golden derived empirically on 2026.1/xcvu9p-flga2104-2L-e: all three requested
# params applied and read back exactly (verify_stuck empty). NUM_LANES is IP-
# derived 10x10 -> 4x25 by CAUI-4 and left out of golden (allow_extra tolerates
# it). Defaults differ from every requested value (CAUI4_MODE 0, GT_REF_CLK_FREQ
# 156.25, INCLUDE_RS_FEC 0), so no requirement can pass by accident.
- id: ip-configurator-test-kit_32
  input_files: []
  cell_name: bench_cell_032
  prompt: 'Integrated UltraScale+ 100G Ethernet subsystem for a CAUI-4 optical link: enable CAUI-4 mode, set the GT reference clock to 161.1328125 MHz, and include the RS-FEC block. This is an UltraScale+ target: if the current project part does not support the IP, swapping the project part to a supported UltraScale+ device is approved and expected -- leave the part swapped when you finish.'
  expected:
    skills:
    - ip-configurator
    expected_output:
      identified_ip: cmac_usplus
      vlnv: xilinx.com:ip:cmac_usplus
      as_configured:
        CONFIG.CMAC_CAUI4_MODE: '1'
        CONFIG.GT_REF_CLK_FREQ: '161.1328125'
        CONFIG.INCLUDE_RS_FEC: '1'
      tier1_success: true
      tier2_success: null
      self_fidelity: full
      notes: "UltraScale+ Integrated 100G Ethernet (CMAC). cmac_usplus is WRONG_PART on the xc2ve3558 baseline (83 supported devices, no xc2ve) and has no same-DISPLAY_NAME edition for this device, so a guarded part swap to xcvu9p-flga2104-2L-e is the correct route -- not substituting the AVAILABLE flexo_100g_rs_fec, which is a different IP (RS-FEC only). CAUI-4 mode (CMAC_CAUI4_MODE=1, which derives NUM_LANES 10x10 -> 4x25), GT reference clock 161.1328125 MHz, RS-FEC included. Part left swapped for read-back; the harness reset restores the baseline."
