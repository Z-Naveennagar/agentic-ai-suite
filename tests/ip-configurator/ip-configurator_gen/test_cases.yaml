# ── Suite: ip-configurator-test-kit ──────────
suite_id: ip-configurator-test-kit
description: Blind IP-configuration benchmark. Each case gives a natural-language design intent; the agent must infer the correct Vivado IP and CONFIG.* properties and emit the mandated JSON output contract. Golden results (from blind_run.sample.jsonl) live per case in expected.expected_output and are the correctness gate via the output_contract_match grader (skill arm only).
flags:
- customer-realistic prompts -- no skill name / protocol / tier / mode mention
- skill_name inferred from case basename by stripping '-test-kit' -> 'ip-configurator'
- expected.expected_output golden = identified_ip, vlnv, as_configured, tier1_success, tier2_success, self_fidelity, notes (the deterministic skill contract)
- vlnv is version-tolerant (golden family matches the agent's :version suffix)
- the agent's mcp_calls / notes / part_swapped are allowed extras (non-deterministic)
- 'output_contract_match is skill_only: it runs in the with-skill arm, skipped no-skill'
test_cases:
- id: ip-configurator-test-kit_01
