# ── Suite grader spec: hls-burst-inference_33 ─────────────────────────
# Rich output_schema format (field -> grader). Per-case {expected_output} /
# {tool_call_observed} values from test_cases.yaml `expected` are substituted
# into the grader_args before grading, so one schema grades every case in
# the suite.
#
# Hallucination contract:
#   - No run/verify step: skill_triggered + output_contract are the only
#     mandatory (no-weight) gates; no_tool_errors is soft/weighted.
#   - Run/verify step present (case 02: v++ --compile --mode hls):
#     skill_triggered, ran_csynth, csynth_report_contains, csynth_report_exists,
#     csynth_report_no_failures, csynth_report_both_ports_burst, and
#     output_contract are ALL mandatory (no-weight) gates; only
#     no_tool_errors stays soft/weighted and drives the numeric score.
#
# output_contract (output_contract_match) replaces the old separate verdict/
# reasoning llm_judge graders: it diffs the agent's final {"verdict",
# "explanation"} JSON against expected_output — verdict by literal/tolerant
# equality (no partial credit), explanation via an LLM judge guided by
# semantic_fields' intent. Because it's one grader with mandatory: true, an
# explanation that misses the golden's cause now fails the whole contract
# instead of just denting a soft-weighted score.
#
# No tool_sequence/action_sequence gate — the expected tool_sequence entries
# are generic tool names (Read, bash: v++) rather than MCP tool calls
# (mcp__<family>__<tool>), so they aren't reliably comparable across agent
# CLI backends. tool_call_observed already independently verifies the
# essential command ran.
output_schema:
  skill_triggered:
    grader: trigger
    always: true
    mandatory: true
    grader_args: '{skills}'   # whole-value passthrough of expected.skills; threshold defaults to 0.5
  ran_csynth:
    grader: tool_call_observed
    always: true
    mandatory: true
    grader_args:
      command: '{tool_call_observed}'
      min_calls: 1
  no_tool_errors:
    # weight: 0 -- purely informational: still runs and is recorded per-case
    # (visible in the dashboard), but contributes nothing to the aggregate
    # score. It's the only non-mandatory grader left in this schema (every
    # other dimension is mandatory: true), so a nonzero weight here would
    # make it the SOLE input to weighted_sum -- a single false positive
    # (e.g. matching "ERROR:" inside the agent's own grep search pattern,
    # not a real error) would then singlehandedly fail an otherwise-perfect
    # case. With weight 0, total scored weight is 0 and runner.py's
    # weighted_sum falls back to t2=1.0, so this grader can never affect
    # pass/fail -- exactly what "soft" is supposed to mean.
    grader: content_contains
    always: true
    mandatory: false
    weight: 0
    grader_args:
      source: stderr
      substring: 'ERROR:'
      must_not_contain: true
  output_contract:
    grader: output_contract_match
    always: false
    mandatory: true
    grader_args:
      expected: '{expected_output}'
      source: final_response
      semantic_threshold: 60
      semantic_fields:
        explanation: >
          Judge whether the agent's explanation identifies substantially the
          same cause / rule / violation as the golden (the reverse /
          decrementing loop causing non-monotonic, non-forward memory access
          on the M-AXI ports). Different wording is fine. Fail (low score) if
          the explanation cites an unrelated or incorrect cause, invents a
          different reason, or claims the conclusion required actually
          running the tool.
  csynth_report_contains:
    grader: content_contains
    always: true
    mandatory: true
    grader_args:
      source: file
      path: '{log_path}'
      substring: '{log_substring}'
  csynth_report_exists:
    grader: artifact_exists
    always: true
    mandatory: true
    grader_args:
      path: '{log_path}'
      min_size_bytes: 1024
  csynth_report_no_failures:
    grader: content_contains
    always: true
    mandatory: true
    grader_args:
      source: file
      path: '{log_path}'
      substring: 'Stride is incompatible'
      must_not_contain: true
  csynth_report_both_ports_burst:
    grader: content_contains
    always: true
    mandatory: true
    grader_args:
      source: file
      path: '{log_path}'
      regex: 'Inferred Burst Summary[\s\S]*?m_axi_aximm\b[\s\S]*?m_axi_aximm0\b'
scoring:
  aggregation: weighted_sum
  pass_threshold: 70.0