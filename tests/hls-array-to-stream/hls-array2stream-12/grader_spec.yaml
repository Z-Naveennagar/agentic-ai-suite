# ── Suite grader spec: hls-array2stream-12 — hls-array-to-stream ─────────
# Rich output_schema format (field -> grader). Per-case {expected_output} /
# {tool_call_observed} values from test_cases.yaml `expected` are substituted
# into the grader_args before grading, so one schema grades every case in
# the suite.
#
# Hallucination contract:
#   - Case _01 is pure analysis: skill_triggered + output_contract are the
#     only mandatory (no-weight) gates; no_tool_errors is soft/weighted
#     (weight: 0 -- see below).
#   - Case _02 is run/verify (v++ compile + C synthesis): skill_triggered,
#     the v++ compile command gate, log_contains, the log-exists gate,
#     both_interfaces_streamed, and output_contract are ALL mandatory
#     (no-weight) gates; only no_tool_errors stays soft/weighted and drives
#     the numeric score.
#
# output_contract (output_contract_match) replaces the old separate verdict/
# reasoning llm_judge graders: it diffs the agent's final {"verdict",
# "explanation"} JSON against expected_output — verdict by literal/tolerant
# equality (no partial credit), explanation via an LLM judge guided by
# semantic_fields' intent.
#
# No tool_sequence/action_sequence gate — the expected tool calls are generic
# (Read, bash: v++) rather than MCP tool names, so they aren't reliably
# comparable across agent CLI backends.
output_schema:
  skill_triggered:
    grader: trigger
    always: true
    mandatory: true
    grader_args: '{skills}'   # whole-value passthrough of expected.skills; threshold defaults to 0.5
  ran_vpp_compile:
    grader: tool_call_observed
    always: true
    mandatory: true
    grader_args:
      command: '{tool_call_observed}'
      min_calls: 1
  no_tool_errors:
    grader: content_contains
    always: true
    mandatory: false
    weight: 0
    grader_args:
      source: stderr
      substring: 'ERROR:'
      must_not_contain: true
  output_contract:
    grader: output_contract_match
    always: false
    mandatory: true
    grader_args:
      expected: '{expected_output}'
      source: final_response
      semantic_threshold: 60
      semantic_fields:
        explanation: >
          Judge whether the agent's explanation identifies substantially the
          same cause as the golden — the custom struct copy-assignment
          operator (A::operator=(const A&)) that violates the struct
          copy-assignment rules for array-to-stream conversion. Different
          wording is fine. Fail (low score) if the explanation cites an
          unrelated or incorrect cause, invents a different reason, or
          claims the conclusion required actually running HLS synthesis.
  log_contains:
    grader: content_contains
    always: true
    mandatory: true
    grader_args:
      source: file
      path: '{log_path}'
      substring: '{log_substring}'
    csynth_log_exists:
    grader: artifact_exists
    always: true
    mandatory: true
    grader_args:
      path: '{log_path}'
      min_size_bytes: 1024
  both_interfaces_streamed:
    grader: content_contains
    always: true
    mandatory: true
    grader_args:
      source: file
      path: '{log_path}'
      regex: '\* AXIS[\s\S]*?in_r\b[\s\S]*?out_r\b'
scoring:
  aggregation: weighted_sum
  pass_threshold: 70.0
