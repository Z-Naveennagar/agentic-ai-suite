# ── Suite grader spec: hls-array-to-stream ──────────────────────────────
# Rich output_schema format (field -> grader). Per-case {expected_output}
# values from test_cases.yaml `expected` are substituted into the grader_args
# before grading, so one schema grades every case in the suite.
#
# Hallucination contract:
#   - No run/verify step (every case in this suite is static-analysis-only):
#     skill_triggered + output_contract are the only mandatory (no-weight)
#     gates; no_tool_errors is soft/weighted (weight: 0 -- see below).
#
# output_contract (output_contract_match) replaces the old separate verdict/
# reasoning llm_judge graders: it diffs the agent's final {"verdict",
# "explanation"} JSON against expected_output — verdict by literal/tolerant
# equality (no partial credit), explanation via an LLM judge guided by
# semantic_fields' intent.
#
# No tool_sequence/action_sequence gate -- generic tool names (Read/Bash)
# are not reliably comparable across agent CLI backends.
output_schema:
  skill_triggered:
    grader: trigger
    always: true
    mandatory: true
    grader_args: '{skills}'   # whole-value passthrough of expected.skills; threshold defaults to 0.5
  no_tool_errors:
    grader: content_contains
    always: true
    mandatory: false
    weight: 0
    grader_args:
      source: stderr
      substring: 'ERROR:'
      must_not_contain: true
  output_contract:
    grader: output_contract_match
    always: false
    mandatory: true
    grader_args:
      expected: '{expected_output}'
      source: final_response
      semantic_threshold: 60
      semantic_fields:
        explanation: >
          Judge whether the agent's explanation identifies substantially the
          same cause / rule / violation as the golden reference answer (the
          specific coding-style rule it cites, e.g. Rules 6.2/6.3/6.4, Rule 4
          struct element type, Rule 5 struct copy assignment). Different
          wording is fine. Fail (low score) if the explanation cites an
          unrelated or incorrect cause, invents a different reason, or claims
          the conclusion required actually running the tool.
scoring:
  aggregation: weighted_sum
  pass_threshold: 70.0
